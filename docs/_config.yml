# GitHub Pages configuration for the Dashboards documentation site.
# Source: the docs/ folder of the main branch, built by GitHub's own Jekyll.
# The theme is fetched at build time (jekyll-remote-theme), so nothing is
# vendored here and there is no Gemfile to keep current.
title: Dashboards for Indigo
description: >-
  Browser dashboards for Indigo Domotics — energy, cameras, heating, every
  room, and the whole day replayed. No app, no cloud, nothing leaving the house.
url: https://highsteads.github.io
baseurl: /Dashboards
remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-relative-links

# Theme options (Just the Docs)
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  button: false
heading_anchors: true
nav_enabled: true
back_to_top: true
back_to_top_text: Back to top
aux_links:
  GitHub: https://github.com/Highsteads/Dashboards
  Releases: https://github.com/Highsteads/Dashboards/releases
aux_links_new_tab: false
footer_content: >-
  © 2026 CliveS · MIT licence · Built with Claude Code.
  The pictures are a real house, captured through a proxy that rewrites every address on the way.

# Static files served as-is
include:
  - screenshots
exclude:
  - demo
