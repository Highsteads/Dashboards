<!DOCTYPE html>
<!--
  Filename:    guest.html
  Description: Guest pairing page (v2.1.0). Open this ON the guest device
               (wall tablet, visitor's phone on home WiFi): it fetches the
               guest token from the plugin's LAN-only proxy, stores it, and
               heads to the hub in read-only mode. Guest devices hold no API
               key — there is no control surface on them at all.
  Author:      CliveS & Claude Fable 5
  Date:        11-06-2026
  Version:     1.0
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dashboards — Guest Pairing</title>
    <link rel="stylesheet" href="dashboards-theme.css">
    <style>
        
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: var(--font-ui);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: var(--card-bg); border-radius: var(--r-lg); padding: 32px 28px;
            max-width: 380px; margin: 16px; text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,.08);
        }
        h1 { font-size: 1.3rem; margin: 0 0 12px; }
        p  { color: var(--text-secondary); font-size: .95rem; line-height: 1.45; }
        .spinner {
            width: 28px; height: 28px; margin: 0 auto 16px;
            border: 3px solid var(--bg); border-top-color: var(--accent);
            border-radius: 50%; animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error h1 { color: var(--err); }
        a { color: var(--accent); }
    
        /* ═══ Shared Apple/Safari polish (v2.25.0) ═════════════════
           Appended uniformly across pages: frosted translucent bars, laptop
           hover states, keyboard focus rings, reduced-motion support, and
           Safari/iOS fixes (dynamic viewport height, text-size-adjust, tap
           highlight). Selectors a page lacks simply never match. */
        html { -webkit-text-size-adjust: 100%; }
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        @supports (min-height: 100dvh) { body { min-height: 100dvh; } }
        a, button, input, select, textarea { -webkit-tap-highlight-color: transparent; }
        :focus-visible { outline: 2px solid var(--accent, #5856d6); outline-offset: 2px; }
        .topbar, .bottombar {
            background: rgba(249, 249, 251, 0.82);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            backdrop-filter: saturate(180%) blur(20px);
            box-shadow: none;
        }
        @media (prefers-color-scheme: dark) {
            .topbar, .bottombar { background: rgba(22, 22, 24, 0.80); }
        }
        @media (hover: hover) and (pointer: fine) {
            a.card:hover, a.dash-card:hover, .fav-tile:not(.fav-reading):hover, a.home-cam:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
            }
            .nav-btn:hover { transform: translateY(-1px); }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="spinner"></div>
        <h1>Setting up guest access…</h1>
        <p>Pairing this device for read-only viewing.</p>
    </div>
    <script>
        "use strict";
        const card = document.getElementById("card");
        async function run() {
            try {
                const ctrl = ("AbortController" in window) ? new AbortController() : null;
                if (ctrl) setTimeout(() => ctrl.abort(), 4000);
                const url = location.protocol + "//" + location.hostname + ":8177/guest-bootstrap";
                const res = await fetch(url, ctrl ? { signal: ctrl.signal } : {});
                if (!res.ok) throw new Error("HTTP " + res.status);
                const d = await res.json();
                if (!d || !d.guestToken) throw new Error("no token in response");
                localStorage.setItem("dash_guest", d.guestToken);
                localStorage.removeItem("indigo_config");   // ensure no full key lingers
                card.innerHTML = `<h1>Guest access ready</h1>
                    <p>This device can view everything but control nothing.
                       Taking you to the dashboard&hellip;</p>`;
                setTimeout(() => { location.href = "index.html"; }, 1100);
            } catch (e) {
                card.classList.add("error");
                card.innerHTML = `<h1>Pairing failed</h1>
                    <p>Guest pairing only works on the home network or Tailscale
                       (${e.message}). If this device should have full access
                       instead, use the <a href="index.html">hub page</a>.</p>`;
            }
        }
        run();
    </script>
    <script src="a11y.js"></script>
</body>
</html>
