<!DOCTYPE html>
<!--
  Filename:    mains.html
  Description: Mains instrument page — every device that measures a 240 V load,
               led by how far those meters can be trusted.

               This house measures its mains with four families of meter and
               they DISAGREE: paired ten-minute means over a week put both
               Athom plugs BELOW the Sigenergy inverter and all fifteen Shellys
               ABOVE it, a spread of about 3.7 V, or 1.5%. None is calibrated
               and the Shelly exposes no trim. So the page deliberately does
               not present one number as truth — it shows each meter's measured
               offset beside its raw reading and lets the disagreement be seen.
               Reading 252.6 V off one plug and acting on it is how a wrong
               over-voltage figure nearly reached the DNO on 08-09-2026.

               v1.1: restyled to the house design language. v1.0 declared only
               its own bespoke rules and relied on .card, header, .main, .note,
               .pill, .loading and .spinner being defined somewhere shared.
               They are not — dashboards-theme.css carries the palette and type
               scale only, and every page declares its own layout. So the page
               rendered essentially unstyled. The base below is the canonical
               block from system-health.html, one of the five pages the theme
               file names as the deliberate design; the bespoke tables and
               badges are gone in favour of .ptable, .gauge, .chip and .badge.
  Author:      CliveS & Claude Opus 5
  Date:        08-09-2026
  Version:     1.1
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="indigo-page-name" content="Mains">
    <meta name="indigo-page-icon" content="bolt">
    <meta name="indigo-page-description" content="Every 240 V meter, what it reads and how far it can be trusted">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dashboards">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5856d6">
    <link rel="apple-touch-icon" sizes="180x180" href="/public/dashboards/apple-touch-icon.png">
    <title>Mains &middot; Dashboards</title>
<link rel="stylesheet" href="dashboards-theme.css">
<style>
:root {
    --hero-grad: linear-gradient(160deg, rgba(245,166,35,0.07), rgba(88,86,214,0.04) 55%, rgba(255,255,255,0));
}
@media (prefers-color-scheme: dark){
  :root {
    --hero-grad: linear-gradient(160deg, rgba(255,179,64,0.12), rgba(125,122,255,0.06) 55%, rgba(0,0,0,0));
}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;width:100%;max-width:100vw}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-ui);
  font-size:14px;min-height:100vh;-webkit-overflow-scrolling:touch;
  padding-top:max(80px, calc(72px + env(safe-area-inset-top)));
}
header{
  display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:8px;
  padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  padding-top:max(10px,env(safe-area-inset-top));
  position:fixed;top:0;left:0;right:0;z-index:10;
  background:rgba(249,249,251,0.82);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border-soft);
}
@media (prefers-color-scheme: dark){header{background:rgba(22,22,24,0.80)}}
.hdr-left{justify-self:start}.hdr-right{justify-self:end}
.hdr-center{justify-self:stretch;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
header h1{font-size:20px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.topbar-status{font-size:11px;color:var(--text-secondary);font-variant-numeric:tabular-nums;white-space:nowrap}
.topbar-status .ts::before{content:'●';color:var(--on-color);margin-right:4px;animation:live-pulse 2.4s ease-in-out infinite}
@keyframes live-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.nav-btn{
  background:var(--card-bg);border:1px solid var(--border-soft);color:var(--accent);
  padding:8px 14px;border-radius: var(--r-md);font-size:14px;font-weight:600;cursor:pointer;
  font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:4px;
  min-height:36px;transition:transform .08s ease-out, background .15s, border-color .15s;
  user-select:none;-webkit-tap-highlight-color:transparent;white-space:nowrap;
}
.nav-btn:hover{background:var(--card-bg-alt);border-color:var(--accent)}
.nav-btn:active{transform:translateY(2px) scale(.96);background:var(--accent);color:#fff}

.main{padding:16px;display:flex;flex-direction:column;gap:12px;max-width:940px;margin:0 auto}
.main > *{min-width:0}
.sec-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-secondary);margin:14px 4px 0}
.card{
  background:var(--card-bg);border:1px solid var(--border-soft);
  border-radius: var(--r-xl);padding:18px;box-shadow:var(--shadow);
  animation:card-in .4s ease-out both;
}
@keyframes card-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card h2{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .pill{font-weight:500;text-transform:none;letter-spacing:0;color:var(--text-muted);font-variant-numeric:tabular-nums}
.muted{color:var(--text-muted)}
.good{color:var(--on-color)}.warn{color:var(--warn)}.bad{color:var(--bad)}

/* verdict hero */
.hero{background:var(--card-bg);background-image:var(--hero-grad)}
.hero-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero-icon{font-size:34px;line-height:1}
.hero-verdict{font-size:24px;font-weight:800;letter-spacing:-.02em}
.hero-sub{font-size:12.5px;color:var(--text-secondary);margin-top:2px}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 11px;border-radius: var(--r-md);
  background:var(--card-bg-alt);border:1px solid var(--border-soft);color:var(--text);font-variant-numeric:tabular-nums}
.chip.good{background:rgba(52,199,89,.14);border-color:rgba(52,199,89,.25);color:var(--on-color)}
.chip.warn{background:rgba(255,149,0,.14);border-color:rgba(255,149,0,.25);color:var(--warn)}
.chip.bad{background:rgba(255,69,58,.14);border-color:rgba(255,69,58,.25);color:var(--bad)}

/* gauges */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:720px){.strip{grid-template-columns:repeat(2,1fr)}}
.gauge{background:var(--card-bg);border:1px solid var(--border-soft);border-radius: var(--r-lg);padding:14px 16px;box-shadow:var(--shadow)}
.gauge-lab{font-size:10.5px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.6px}
.gauge-big{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:-.02em}
.gauge-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px}
.gauge .bar{margin-top:8px}
.gauge.warn .gauge-big{color:var(--warn)}
.gauge.bad .gauge-big{color:var(--bad)}

/* meters / kv */
.meter{margin-bottom:14px}
.meter:last-child{margin-bottom:0}
.meter-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px}
.meter-head b{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:5px;background:var(--track);overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .4s ease}
.meter-note{font-size:11px;color:var(--text-muted);margin-top:5px;line-height:1.45}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;color:var(--text-secondary);border-top:1px solid var(--border-soft)}
.kv:first-child{border-top:0}
.kv b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius: var(--r-sm)}
.badge.good{background:rgba(52,199,89,.16);color:var(--on-color)}
.badge.warn{background:rgba(255,149,0,.16);color:var(--warn)}
.badge.bad{background:rgba(255,69,58,.16);color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}

.ditem{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border-soft);font-size:13px}
.ditem:first-child{border-top:0}
.ditem .dn{flex:1;min-width:0}
.ditem .dn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ditem .dn span{font-size:11.5px;color:var(--text-secondary)}
.ditem .dv{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.empty{font-size:12.5px;color:var(--text-muted);padding:4px 0}

table.ptable{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.ptable th,table.ptable td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--border-soft)}
table.ptable th:first-child,table.ptable td:first-child{text-align:left}
table.ptable th{font-size:11px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
table.ptable tr:last-child td{border-bottom:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--off-color);margin-right:6px;vertical-align:middle}
.dot.on{background:var(--on-color)}.dot.off{background:var(--bad)}

details{margin-top:8px}
summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent)}
.note{font-size:11px;color:var(--text-muted);margin-top:10px;line-height:1.5}
.loading{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.spinner{width:24px;height:24px;border:3px solid var(--off-color);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Safari / a11y polish */
html{-webkit-text-size-adjust:100%}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
@supports (min-height:100dvh){body{min-height:100dvh}}
a,button,input,select,textarea{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important;scroll-behavior:auto !important}
}
@media(max-width:480px){
  header{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
  header h1{font-size:15px}
  .main{padding:10px;gap:10px}
  .card{padding:14px}
  .gauge-big{font-size:22px}
  .hero-verdict{font-size:20px}
}

.topbar h1 .dsh-icon,h1 .dsh-icon{width:.86em;height:.86em;vertical-align:-.08em;margin-right:.12em;opacity:.85}


/* ── the status line says when it has stopped ────────────────────────────────
   A page that has rendered once could never report that it had stopped: the
   error handler only speaks when #content is EMPTY, so a dead poll left
   plausible-looking readings on screen with nothing but a quietly frozen clock
   to say so. Neither CliveS nor I could settle it from what was visible. The
   dot goes amber and stops pulsing, and the line says how long it has been. */
.topbar-status.stale{color:var(--warn);font-weight:600}
.topbar-status.stale .ts::before{color:var(--warn);animation:none}

/* ── why this page does not flash ────────────────────────────────────────────
   The house `.card` carries `animation:card-in .4s ease-out both` — a fade-up
   meant as a FIRST-PAINT flourish. These pages replace the whole of #content on
   every 30-second poll, which recreates every card and replays it, so the
   entire page faded up from transparent twice a minute. That is the flashing.
   It runs once now and never again. */
.card{animation:none}
#content.first-paint .card{animation:card-in .4s ease-out both}

/* Kept from the voltage map, which moved to meter.html with its card: the
   tile's corner chip still colours a meter's offset by its direction. */
.off-hi{color:var(--warn)}
.off-lo{color:var(--accent)}
.dot.stale{background:var(--warn)}

/* ── meter tiles ─────────────────────────────────────────────────────────────
   Same shape as a room's light card (room.html): card background, r-lg, the
   house shadow, and a coloured left edge carrying the state. The whole tile is
   the link, so it is one tap anywhere rather than a hit-target inside a row. */
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.mcard{
  background:var(--card-bg);border:1px solid var(--border-soft);
  border-left:3px solid var(--on-color);border-radius:var(--r-lg);
  padding:12px 14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:5px;
  text-decoration:none;color:inherit;min-width:0;
  transition:transform .12s ease-out, box-shadow .15s, border-color .15s;
}
.mcard:hover{box-shadow:var(--shadow-hover)}
.mcard:active{transform:scale(.975)}
.mcard.stale{border-left-color:var(--warn)}
.mcard.dead{border-left-color:var(--bad)}
.mcard.dead .mc-watts,.mcard.dead .mc-line{color:var(--text-muted)}
.mc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.mc-name{font-size:13px;font-weight:600;line-height:1.25;min-width:0;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mc-off{font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;
  flex-shrink:0;padding:2px 6px;border-radius:var(--r-sm);background:var(--card-bg-alt)}
.mc-watts{font-size:23px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.05}
.mc-watts .u{font-size:13px;font-weight:600;color:var(--text-secondary);margin-left:2px}
.mc-line{display:flex;flex-wrap:wrap;gap:2px 9px;font-size:11px;
  color:var(--text-secondary);font-variant-numeric:tabular-nums}
.mc-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;
  margin-top:2px;padding-top:6px;border-top:1px solid var(--border-soft);
  font-size:10.5px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.mc-state{display:flex;align-items:center;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
/* On a tile that is not answering the reason takes the whole foot: today's
   units from a dead meter are a last known value, not a measurement, and
   squeezing them in beside a long reason wrapped both into three lines. */
.mc-today{flex-shrink:0;white-space:nowrap}
@media(max-width:480px){
  .mcards{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
  .mc-watts{font-size:20px}
}
.sub{font-size:10.5px;color:var(--text-muted);font-weight:500}
</style>
</head>
<body>
<header>
  <div class="hdr-left"><a class="nav-btn" href="index.html">&larr; Home</a></div>
  <div class="hdr-center">
    <h1><span data-icon="bolt"></span> Mains</h1>
    <span class="topbar-status" id="freshness"><span class="ts">Updated <span id="ts">&#8212;</span></span> <span id="cadence">&middot; every 30s</span></span>
  </div>
  <div class="hdr-right"><a class="nav-btn" href="active.html">Active &rarr;</a></div>
</header>

<main class="main">
  <div id="content"><div class="loading"><div class="spinner"></div><p>Connecting&#8230;</p></div></div>
</main>

<script src="config.js" onerror="window.INDIGO_CONFIG_MISSING=true"></script>
<script src="dashboards-auth.js"></script>
<script src="dashboards-ui.js"></script>
<script src="dashboards-gate.js"></script>
<script>
const POLL_INTERVAL_MS = 30000;
const MAINS_EP = "/message/com.clives.indigoplugin.dashboards/mainsMeters/";
const I = (n) => (window.DashIcons ? DashIcons.svg(n) : "");

if (!window.INDIGO_CONFIG || !window.INDIGO_CONFIG.apiKey) { location.href = "index.html"; }

async function mainsFetch() {
    // Never call /message/ while the plugin is stopping — a request in flight
    // when the host dies wedges the whole of IWS for five minutes.
    if (window.DashGate && await window.DashGate.check() === "down")
        throw new Error("Dashboards plugin restarting");
    const key = (window.INDIGO_CONFIG || {}).apiKey || "";
    return fetch(MAINS_EP, { method: "POST",
        headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
        body: "{}" });
}

function esc(t) { const d = document.createElement("div"); d.textContent = String(t == null ? "" : t); return d.innerHTML; }
function has(v) { return v !== null && v !== undefined && !isNaN(Number(v)); }
function num(v, dp) { return has(v) ? Number(v).toFixed(dp == null ? 1 : dp) : "&#8212;"; }
function signed(v, dp) { const n = Number(v); return (n > 0 ? "+" : "") + n.toFixed(dp == null ? 2 : dp); }
function plural(n, one, many) { return Number(n) === 1 ? one : (many || one + "s"); }
function setTs() {
    const d = new Date(), p = n => String(n).padStart(2, "0");
    const el = document.getElementById("ts");
    if (el) el.textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    // Only a poll that actually returned data may reset this, and clearing the
    // amber immediately beats waiting up to five seconds for the next sweep.
    _lastGood = Date.now();
    markFreshness();
}

/* ── how fresh is what you are looking at ───────────────────────────────────
   Driven by its OWN timer, not by the poll: a poll that has died cannot be
   trusted to report that it has died. Pure so a test can drive it. */
const STALE_AFTER_MS = 90000;          // three missed thirty-second polls
let _lastGood = 0;

function agoWords(ms) {
    const s = Math.round(ms / 1000);
    if (s < 90) return s + (s === 1 ? " second" : " seconds");
    const m = Math.round(s / 60);
    if (s < 3600) return m + (m === 1 ? " minute" : " minutes");
    const h = Math.round(s / 3600);
    return h + (h === 1 ? " hour" : " hours");
}

function freshness(ageMs) {
    // Before anything has arrived there is nothing to be stale about — the
    // loading card is already saying so, and an amber "not updating" over a
    // page that has never loaded would be its own kind of wrong.
    if (!(ageMs >= 0)) return { stale: false, text: "&middot; every 30s" };
    if (ageMs <= STALE_AFTER_MS) return { stale: false, text: "&middot; every 30s" };
    return { stale: true, text: "&middot; not updating for " + agoWords(ageMs) };
}

function markFreshness() {
    const bar = document.getElementById("freshness");
    const cad = document.getElementById("cadence");
    if (!bar || !cad || !_lastGood) return;
    const f = freshness(Date.now() - _lastGood);
    bar.classList.toggle("stale", f.stale);
    cad.innerHTML = f.text;
}
setInterval(markFreshness, 5000);

/* One writer for the page, so the DOM is touched as little as possible.
   - Identical output writes NOTHING: a rebuild drops text selection and closes
     anything the reader has opened, for no gain.
   - The entry animation is added for the first paint only (see the CSS above).
   - Anything the reader has opened is reopened after the swap. */
let _painted = false, _lastHtml = "";
function paint(html) {
    const host = document.getElementById("content");
    if (!host || html === _lastHtml) return;
    _lastHtml = html;
    const opened = Array.from(host.querySelectorAll("details[open]"))
                        .map(d => d.id).filter(Boolean);
    if (!_painted) host.classList.add("first-paint");
    host.innerHTML = html;
    for (const id of opened) {
        const d = host.querySelector("#" + id);
        if (d) d.open = true;
    }
    if (!_painted) {
        _painted = true;
        setTimeout(() => host.classList.remove("first-paint"), 600);
    }
}

/* ── the trust hero: the headline is the DISAGREEMENT ─────────────────────── */
function renderTrust(off, refName) {
    const head = (verdict, sub) => `<section class="card hero">
      <div class="hero-top">
        <div class="hero-icon">${I("bolt")}</div>
        <div>
          <div class="hero-verdict">${verdict}</div>
          <div class="hero-sub">${sub}</div>
        </div>
      </div>`;
    if (!off || off.building) {
        return head("Measuring&#8230;", "Working out how far these meters disagree")
            + `<div class="note">This reads a week of history for every voltage meter in the
               house and takes a moment. It will appear on the next refresh.</div></section>`;
    }
    if (off.ok === false) {
        return head("Not measured", esc(off.error || "Offsets are not available"))
            + `</section>`;
    }
    const sp = off.spread;
    if (!sp) {
        return head("Not enough history", "Fewer than two meters have enough paired readings yet")
            + `</section>`;
    }
    let html = head(num(sp.spread, 1) + " V apart",
        `across ${sp.meters} voltage ${plural(sp.meters, "meter")}, measured against `
        + esc(refName || "the inverter"));
    html += `<div class="hero-chips">
        <div class="chip">${I("inverter")} Against ${esc(refName || "the inverter")}</div>
        <div class="chip">${off.days} ${plural(off.days, "day")} of ten-minute means</div>
        <div class="chip warn">Lowest ${signed(sp.low)} V</div>
        <div class="chip warn">Highest ${signed(sp.high)} V</div>
      </div>
      <div class="note">None of these meters is calibrated, so no single reading on this page is
      better than about ${num(sp.spread, 1)} V. Everything below is shown RAW with its measured
      offset beside it — a corrected number would claim an authority none of them has, and the
      reference is only the best-specified instrument here rather than the truth.</div></section>`;
    return html;
}

/* ── the four numbers worth seeing at a glance ────────────────────────────── */
function renderStrip(d) {
    const ref = d.reference || {};
    const rows = d.meters || [];
    const live = rows.filter(r => r.state === "live").length;
    const gone = rows.length - live;
    const share = (has(d.unmeteredWatts) && ref.houseWatts)
        ? Math.max(0, Math.min(100, 100 * d.unmeteredWatts / ref.houseWatts)) : null;
    const houseSub = ref.name ? "measured by " + esc(ref.name) : "no whole-house reading";
    return `<div class="strip">
      <div class="gauge">
        <div class="gauge-lab">House now</div>
        <div class="gauge-big">${num(ref.houseWatts, 0)} W</div>
        <div class="gauge-sub">${houseSub}</div>
      </div>
      <div class="gauge">
        <div class="gauge-lab">Measured</div>
        <div class="gauge-big">${num(d.meteredWatts, 0)} W</div>
        <div class="gauge-sub">across ${live} live ${plural(live, "meter")}</div>
      </div>
      <div class="gauge${share !== null && share > 50 ? " warn" : ""}">
        <div class="gauge-lab">Unmeasured</div>
        <div class="gauge-big">${num(d.unmeteredWatts, 0)} W</div>
        <div class="gauge-sub">${share === null
            ? esc(d.unmeteredWhy || "nothing to compare against")
            : Math.round(share) + "% of the house"}</div>
        ${share === null ? "" : `<div class="bar"><div class="bar-fill"
            style="width:${share.toFixed(1)}%;background:var(--home-load)"></div></div>`}
      </div>
      <div class="gauge${gone ? " warn" : ""}">
        <div class="gauge-lab">Meters</div>
        <div class="gauge-big">${rows.length}</div>
        <div class="gauge-sub">${gone ? gone + " not answering" : "all answering"}</div>
      </div>
    </div>`;
}

/* ── what nothing is measuring ────────────────────────────────────────────── */
function renderUnmetered(d) {
    const ref = d.reference || {};
    let body;
    if (!has(d.unmeteredWatts)) {
        body = `<div class="empty">${esc(d.unmeteredWhy || "No whole-house reading to compare against.")}</div>`;
    } else {
        const share = ref.houseWatts ? Math.round(100 * d.unmeteredWatts / ref.houseWatts) : null;
        body = `<div class="kv">The house is drawing <b>${num(ref.houseWatts, 0)} W</b></div>
            <div class="kv">The meters above account for <b>${num(d.meteredWatts, 0)} W</b></div>
            <div class="kv">Nothing measures the remaining
                <b class="warn">${num(d.unmeteredWatts, 0)} W</b></div>
            <div class="note">${share === null ? "" : `That is ${share}% of what the house is using. `}Steps
            in this figure are the appliances with no meter of their own — the oven, the kettle, the
            shower — announcing themselves.</div>`;
    }
    return `<section class="card"><h2>What nothing is measuring</h2>${body}</section>`;
}

/* ── the full census, as tiles ───────────────────────────────────────────────
   A table read well on a laptop and badly on a phone, and it gave nothing to
   tap. Each meter is now a tile carrying what fits — its power, its three
   readings, today's units and its state — and opens meter.html for the rest. */
function meterTile(r, off) {
    const gone = r.state !== "live";
    const cls = r.state === "live" ? "" : (r.state === "stale" ? " stale" : " dead");
    const o = (off && off.meters) ? off.meters[String(r.id)] : null;
    const bits = [];
    if (gone) {
        // The watts were already dashed here and the volts, amps and power
        // factor were not, so an unplugged freezer monitor read "— W · 250.6 V
        // · 0.000 A" and CliveS quite reasonably asked how a plug with no mains
        // was measuring 250 volts. It is not: that is the last value it sent
        // before it lost power, and Indigo keeps a device's states for ever.
        // Guard the WHOLE reading, not the headline of it.
        const last = [];
        if (has(r.watts)) last.push(num(r.watts, 1) + " W");
        if (has(r.volts)) last.push(num(r.volts, 1) + " V" + (r.voltsImplausible ? "?" : ""));
        bits.push(`<span class="muted">${last.length
            ? "last sent " + last.join(" &middot; ") : "no readings"}</span>`);
    } else {
        if (has(r.volts))
            bits.push(r.voltsImplausible
                ? `<span class="bad">${num(r.volts, 1)} V?</span>`
                : `<span>${num(r.volts, 1)} V</span>`);
        if (has(r.amps)) bits.push(`<span>${num(r.amps, 3)} A</span>`);
        if (has(r.pf)) bits.push(`<span>pf ${num(r.pf, 2)}${
            r.pfSource === "derived" ? " <span class=\"sub\">calc</span>" : ""}</span>`);
        // A meter that reports on change may never send its zero. Where the
        // device says it is off, its last figure is not counted — but it is
        // still shown, or 75.9 W would simply disappear off the page.
        if (has(r.lastKnownWatts))
            bits.unshift(`<span>off since it drew ${num(r.lastKnownWatts, 1)} W</span>`);
    }
    const dot = r.state === "live" ? "on" : (r.state === "stale" ? "stale" : "off");
    return `<a class="mcard${cls}" href="meter.html?id=${r.id}"
        aria-label="${esc(r.name)}, ${gone ? esc(r.why || r.state) : num(r.watts, 1) + " watts"}">
      <div class="mc-head">
        <div class="mc-name">${esc(r.name)}</div>
        ${o ? `<span class="mc-off ${o.mean >= 0 ? "off-hi" : "off-lo"}">${signed(o.mean)}</span>` : ""}
      </div>
      <div class="mc-watts">${gone ? "&#8212;" : num(r.watts, 1)}<span class="u">W</span></div>
      <div class="mc-line">${bits.join("") || "<span>no other readings</span>"}</div>
      <div class="mc-foot">
        <span class="mc-state" title="${gone ? esc(r.why || r.state) : "live"}"><span
          class="dot ${dot}"></span>${gone ? esc(r.why || r.state) : "live"}</span>
        ${gone ? "" : `<span class="mc-today">${
            has(r.todayKwh) ? num(r.todayKwh, 2) + " kWh today" : ""}</span>`}
      </div>
    </a>`;
}

function renderMeters(rows, off, staleAfter) {
    // Live first and heaviest first, because that is the order someone
    // scanning for "what is using the power" reads in. The ones that are not
    // answering go last rather than being sorted by a watts figure that is not
    // a measurement.
    const live = rows.filter(r => r.state === "live").sort((a, b) => b.watts - a.watts);
    const gone = rows.filter(r => r.state !== "live")
                     .sort((a, b) => a.name.localeCompare(b.name));
    let html = `<section class="card">
      <h2>Every meter <span class="pill">${rows.length}, tap one for the detail</span></h2>
      <div class="mcards">${live.map(r => meterTile(r, off)).join("")}</div>`;
    if (gone.length) {
        html += `<div class="sec-label" style="margin:16px 0 8px">Not answering</div>
          <div class="mcards">${gone.map(r => meterTile(r, off)).join("")}</div>`;
    }
    html += `<div class="note">A reading older than ${Math.round(staleAfter / 60)} minutes from a
      meter that polls, or any reading from a plugin that is not running, is a last known value
      rather than a measurement. A meter that reports only when something changes is judged on
      whether it is answering, not on the clock. The figure in the corner is how far that meter
      normally sits from the reference. Power factor marked <span class="sub">calc</span> is
      worked out from watts against volts times amps; the rest is reported by the meter itself.
      Watts are never calculated from volts and amps — on a switch-mode supply that overstates
      the load by more than half.</div></section>`;
    return html;
}

function render(d) {
    const rows = d.meters || [];
    const refName = (d.reference || {}).name;
    // The voltage map and the per-meter offset table moved onto the individual
    // meter's page (v3.9.0). They are context for ONE reading, and keeping them
    // here pushed the thing this page is actually for — the meters themselves —
    // below two full screens of analysis, which is how CliveS came to miss them.
    paint(renderTrust(d.offsets, refName)
        + renderStrip(d)
        + `<div class="sec-label">The meters</div>`
        + renderMeters(rows, d.offsets, d.staleAfterSeconds || 900)
        + `<div class="sec-label">The house</div>`
        + renderUnmetered(d));
    // No icon pass needed: I() inlines the SVG, and dashboards-icons.js keeps a
    // MutationObserver on the body for any data-icon that arrives later. There
    // is no DashIcons.render — a guarded call to one would be a silent no-op.
}

async function tick() {
    try {
        const r = await mainsFetch();
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        if (d.ok === false) throw new Error(d.error || "endpoint error");
        render(d);
        setTs();
    } catch (e) {
        // Leave evidence. A stall that is caught and silently swallowed is
        // exactly as undiagnosable as one that is not caught at all.
        console.error("[Mains] poll failed:", e);
        const el = document.getElementById("content");
        // Only replace the page when there is nothing on it — a blink of an
        // error card over good readings is worse than a stale timestamp.
        // Through paint() too, or _lastHtml goes stale and the next identical
        // healthy render is skipped as a no-op, leaving this card on screen.
        if (el && !el.querySelector(".card")) {
            paint(`<section class="card"><h2>Not reading</h2>
                <div class="empty">${esc(e.message)}. Trying again shortly.</div></section>`);
        }
    }
}
tick();
setInterval(tick, POLL_INTERVAL_MS);
</script>
<script src="dashboards-icons.js"></script>
<script src="a11y.js"></script>
<script src="standalone-nav.js"></script>
</body>
</html>
