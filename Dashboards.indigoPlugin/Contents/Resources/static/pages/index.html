                     <span id="wx-sol-score"></span>
                 </div>
             </div>`;
        _solBuilt = true;
    }

    // Per-string hours for the compact chart. Same endpoint the Energy page
    // uses, same 5-minute cadence, same gate — an ungated /message poll into
    // a restarting plugin is the 5-minute IWS wedge.
    let _wxStringHours = null;
    async function _refreshStringHours() {
        if (document.hidden) return;   // a background tab has nothing to draw
        if (window.DashGate && await window.DashGate.check() === "down") return;
        try {
            const key = (window.INDIGO_CONFIG || {}).apiKey || "";
            if (!key) return;   // guest-paired (no key): a bare Bearer is a 401, and three of those re-pair the browser (v2.95.1)
            const r = await _msg("/message/com.clives.indigoplugin.dashboards/solarStringHours/", "{}");
            if (_authRefused(r) || !r.ok) return;
            const d = await r.json();
            if (d && d.ok) { _wxStringHours = d; renderWeatherSolar(); }
        } catch (_) { /* chart degrades to forecast-only — never blocks the hub */ }
    }

    // Server-side "today" and minutes-of-day, from the payloads the server
    // stamps, with the browser as the fallback for an older plugin.
    function _serverClock() {
        const now = new Date();
        let todayStr = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0")
                     + "-" + String(now.getDate()).padStart(2, "0");
        let nowMin = now.getHours() * 60 + now.getMinutes();
        if (_wxStringHours && /^\d{4}-\d{2}-\d{2}$/.test(_wxStringHours.date || "")) todayStr = _wxStringHours.date;
        const ts = (_sigen() || {}).timestamp;
        const m = /^(\d{2}):(\d{2})/.exec(String(ts || ""));
        if (m) nowMin = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
        return { todayStr, nowMin };
    }

    // Redraw only when something the chart shows has actually changed — this
    // renderer fires on the 3s device poll and the chart is an SVG.
    let _wxFcSig = null;
    function renderWeatherSolar() {
        const card = document.getElementById("solar-now");
        const d = _sigen();
        if (!card) return;
        // No inverter, or nothing from it yet: the card is not drawn at all
        // rather than left as an empty box on the landing page.
        if (!d || !d.solar) { card.style.display = "none"; return; }
        const sol = d.solar;
        const actual = sol.actual_today_kwh, fc = sol.today_kwh;
        if (actual == null && fc == null) { card.style.display = "none"; return; }
        card.style.display = "";
        _ensureSolarShell(card);
        const wrap = document.getElementById("wx-solar");
        if (!wrap) return;
        wrap.style.display = "";
        const setT = (id, v) => { const e = document.getElementById(id); if (e && e.textContent !== v) e.textContent = v; };
        setT("wx-sol-actual", actual != null ? actual.toFixed(1) : "—");
        setT("wx-sol-fc", fc != null ? String(Math.round(fc)) : "—");
        const bar = document.getElementById("wx-sol-bar");
        if (bar) bar.style.width = (fc ? Math.max(0, Math.min(100, Math.round((actual / fc) * 100))) : 0) + "%";
        setT("wx-sol-rem", sol.remaining_kwh != null ? sol.remaining_kwh.toFixed(1) + " kWh" : "—");
        setT("wx-sol-tmrw", sol.tomorrow_kwh != null ? Math.round(sol.tomorrow_kwh) + " kWh" : "—");
        if (!window.DashUI || !window.DashCalc) return;

        // The SERVER's day and clock (v2.95.3), not the viewer's: from Perth
        // (UTC+8) at 17:00 the browser said most of the day's forecast was
        // due while London was at 09:00. The string-hours payload carries the
        // server's date, and the status payload its local time of day.
        const clk = _serverClock();
        const todayStr = clk.todayStr, nowMin = clk.nowMin;
        const fresh = (_wxStringHours && _wxStringHours.date === todayStr) ? _wxStringHours : null;
        // No slots on the hub — it never fetches history; the endpoint's own
        // site series already covers every hour, so there is nothing to lose.
        const model = DashCalc.buildSolarHours(fresh && fresh.hours, fresh && fresh.site,
                                               null, d.hourly_forecast || {}, nowMin, todayStr);
        const labels = ((sol.strings || []).length
            ? sol.strings.map(s => s.label)
            : ["West", "East", "South", "Garage"]);
        const sig = JSON.stringify([model.rows.map(r => [r.mode, r.total, r.parts ? 1 : 0]),
                                    model.won, model.played, labels,
                                    document.documentElement.dataset.theme || ""]);
        if (sig !== _wxFcSig) {
            _wxFcSig = sig;
            DashUI.solarHoursChart(document.getElementById("wx-fc"), model,
                                   { stringLabels: labels, compact: true });
            const leg = document.getElementById("wx-sol-legend");
            if (leg) {
                const anyStacked = model.rows.some(r => r.parts);
                if (anyStacked) {
                    leg.innerHTML = DashUI.STRING_STACK_ORDER.map(i =>
                        `<span class="li"><i style="background:${DashUI.STRING_COLOURS[i]}"></i>${escapeAttr(labels[i] || "")}</span>`).join("");
                    leg.style.display = "";
                } else {
                    leg.style.display = "none";
                }
            }
        }
        setT("wx-sol-score", model.played ? `Beat forecast ${model.won}/${model.played} h` : "");
    }

    // Ecowitt sensors found by STATE SIGNATURE, not hardcoded device ids —
    // the ids that used to sit here were this author's house and nobody
    // else's, so the card read "Ecowitt unavailable" on every other install.
    // The signature is the Ecowitt plugin's own state vocabulary.
    function _findBySignature(devices, required, preferName) {
        const hits = devices.filter(d => {
            const s = d.states || {};
            return required.every(k => s[k] !== undefined);
        });
        if (hits.length > 1 && preferName) {
            const named = hits.find(d => preferName.test(d.name || ""));
            if (named) return named;
        }
        return hits[0] || null;
    }

    function renderWeatherCard(devices) {
        const el = document.getElementById("weather-now");
        if (!el) return;
        const wind    = _findBySignature(devices, ["windSpeed", "windGust"]);
        const rain    = _findBySignature(devices, ["rainDaily"]);
        const indoor  = _findBySignature(devices, ["temperature", "pressureRelative"], /indoor/i);
        const outdoor = _findBySignature(
            devices.filter(d => d !== indoor),
            ["temperature", "humidity", "dewPoint"], /outdoor/i);
        if (!outdoor) {
            // No Ecowitt station. OpenWeatherMap alone still has conditions,
            // today's range, sun times and UV (v2.96.0) — and with neither
            // source the card says what would fill it, in plain words.
            const owm0 = window.__OWM_DATA || null;
            _wxBuilt = false;
            if (owm0) {
                const hiLo = (Number.isFinite(owm0.today_max) && Number.isFinite(owm0.today_min))
                    ? `${owm0.today_max.toFixed(0)}° / ${owm0.today_min.toFixed(0)}°` : "";
                const cond = owm0.now_conditions || owm0.today_summary || "";
                const sr = _fmtSunTime(owm0.sunrise, owm0.tz_offset), ss = _fmtSunTime(owm0.sunset, owm0.tz_offset);
                el.innerHTML = `<h3>Weather</h3>
                    <div class="row"><span>${escapeAttr([cond, hiLo].filter(Boolean).join(" · ") || "—")}</span></div>
                    <div class="row"><span>${sr ? "Sunrise " + escapeAttr(sr) : ""}${sr && ss ? " · " : ""}${ss ? "Sunset " + escapeAttr(ss) : ""}</span></div>
                    ${Number.isFinite(owm0.now_uvi) ? `<div class="row"><span>UV ${owm0.now_uvi.toFixed(0)}</span></div>` : ""}
                    <div class="muted">OpenWeatherMap · no local station</div>`;
            } else {
                el.innerHTML = `<h3>Weather</h3><div class="muted">No weather source — add an Ecowitt station, or an OpenWeatherMap key and your coordinates under Plugins → Dashboards → Configure.</div>`;
            }
            return;
        }
        const o = outdoor.states || {};
        const w = (wind || {}).states || {};
        const r = (rain || {}).states || {};
        const i = (indoor || {}).states || {};
        const temp     = parseFloat(o.temperature);
        const hum      = parseFloat(o.humidity);
        // Ecowitt publishes m/s; old data may have used Mph keys. Detect unit
        // so the displayed value matches what's in the device states.
        const windUnit = (w.windSpeedUnit || "").toLowerCase();
        const rawSpeed = parseFloat(w.windSpeed);
        const rawGust  = parseFloat(w.windGust);
        const rawMaxGust = parseFloat(w.maxDailyGust);
        const toMph    = (v) => windUnit === "m/s" ? v * 2.23694 : v;
        const speedMph = isFinite(rawSpeed) ? toMph(rawSpeed) : null;
        const gustMph  = isFinite(rawGust)  ? toMph(rawGust)  : null;
        const maxGustMph = isFinite(rawMaxGust) ? toMph(rawMaxGust) : null;
        const dir      = w.windDirectionCardinal || w.windCardinal || w.windDir || "";
        const rateMm   = parseFloat(r.rainRateMm || r.rainRateMmh || r.rainHourly) || 0;
        // Ecowitt rainDaily comes in inches by default unless the user
        // configured mm. Convert via rainUnit so the rendered figure is
        // always in mm regardless of source config.
        const rainUnit = (r.rainUnit || "").toLowerCase();
        const rawRain  = parseFloat(r.rainDaily);
        const rainDailyMm = isFinite(rawRain)
            ? (rainUnit === "in" || rainUnit === "inch" ? rawRain * 25.4 : rawRain)
            : null;
        const inT      = parseFloat(i.temperature);
        const inHum    = parseFloat(i.humidity);
        const pressure = parseFloat(i.pressureRelative || i.pressureAbsolute);
        const pTrend   = _trackPressure(pressure);
        const feelsLike = _windChill(temp, speedMph);
        const owm = window.__OWM_DATA || null;
        const sunsetStr  = owm  ? _fmtSunTime(owm.sunset,  owm.tz_offset) : null;
        const sunriseStr = owm  ? _fmtSunTime(owm.sunrise, owm.tz_offset) : null;
        const todayHi    = owm && isFinite(owm.today_max) ? owm.today_max : null;
        const todayLo    = owm && isFinite(owm.today_min) ? owm.today_min : null;
        const conditions = owm && (owm.now_conditions || owm.today_summary) || "";
        const uvi        = owm && isFinite(owm.now_uvi) ? owm.now_uvi : null;
        // Compact mode for narrow phone viewports — 4–5 highlight rows
        // only. Drops wind gust/max, rain rate, pressure trend, UV, indoor.
        // Full detail behind the tap-through to ecowitt.html.
        const isCompact = window.innerWidth <= 600;
        if (isCompact) {
            _ensureWeatherShell(el);
            document.getElementById('weather-rows').innerHTML = `
                <h3>Weather${conditions ? ` · ${escapeAttr(conditions)}` : ""}</h3>
                <div class="row"><span class="key">Outdoor</span><span class="val big">${isFinite(temp) ? temp.toFixed(1) + "°" : "—"}</span></div>
                ${isFinite(hum) ? `<div class="row"><span class="key">Humidity</span><span class="val">${hum.toFixed(0)}%</span></div>` : ""}
                ${speedMph != null ? `<div class="row"><span class="key">Wind</span><span class="val">${speedMph.toFixed(0)} mph${dir ? " " + dir : ""}</span></div>` : ""}
                ${rainDailyMm != null && rainDailyMm > 0 ? `<div class="row"><span class="key">Rain</span><span class="val warn">${rainDailyMm.toFixed(1)} mm</span></div>` : ""}
                ${(sunriseStr || sunsetStr) ? `<div class="row"><span class="key">Sun</span><span class="val">${sunriseStr || "—"}↑ ${sunsetStr || "—"}↓</span></div>` : ""}`;
            return;
        }
        _ensureWeatherShell(el);
            document.getElementById('weather-rows').innerHTML = `
            <h3>Weather${conditions ? ` · ${escapeAttr(conditions)}` : ""}</h3>
            <div class="row"><span class="key">Outdoor</span><span class="val big">${isFinite(temp) ? temp.toFixed(1) + "°C" : "—"}</span></div>
            ${feelsLike != null ? `<div class="row"><span class="key">Feels like</span><span class="val">${feelsLike.toFixed(1)}°C</span></div>` : ""}
            ${(todayHi != null && todayLo != null) ? `<div class="row"><span class="key">Today</span><span class="val">${todayHi.toFixed(0)}° / ${todayLo.toFixed(0)}°</span></div>` : ""}
            ${isFinite(hum) ? `<div class="row"><span class="key">Humidity</span><span class="val">${hum.toFixed(0)}%</span></div>` : ""}
            ${speedMph != null ? `<div class="row"><span class="key">Wind</span><span class="val">${speedMph.toFixed(0)} mph${dir ? " " + dir : ""}${gustMph ? ` · gust ${gustMph.toFixed(0)}` : ""}${maxGustMph && (!gustMph || maxGustMph > gustMph + 1) ? ` · max ${maxGustMph.toFixed(0)}` : ""}</span></div>` : ""}
            ${rateMm > 0 ? `<div class="row"><span class="key">Rain rate</span><span class="val warn">${rateMm.toFixed(1)} mm/h</span></div>` : ""}
            ${rainDailyMm != null ? `<div class="row"><span class="key">Rain today</span><span class="val ${rainDailyMm > 0 ? "" : "muted"}">${rainDailyMm > 0 ? rainDailyMm.toFixed(1) + " mm" : "dry"}</span></div>` : ""}
            ${isFinite(pressure) ? `<div class="row"><span class="key">Pressure</span><span class="val">${pressure.toFixed(0)} hPa${pTrend ? " " + pTrend.arrow + " " + pTrend.word : ""}</span></div>` : ""}
            ${uvi != null ? `<div class="row"><span class="key">UV index</span><span class="val">${uvi.toFixed(1)}</span></div>` : ""}
            ${(sunriseStr || sunsetStr) ? `<div class="row"><span class="key">Sun</span><span class="val">${sunriseStr || "—"} ↑ · ${sunsetStr || "—"} ↓</span></div>` : ""}
            ${isFinite(inT) ? `<div class="row"><span class="key">Indoor</span><span class="val">${inT.toFixed(1)}°C${isFinite(inHum) ? " · " + inHum.toFixed(0) + "%" : ""}</span></div>` : ""}`;
    }

    // ── Live room tiles (v2.31.0) ─────────────────────────────
    // Each Rooms-grid tile shows live state from the same 3s device poll:
    // room temperature (average of its TRVs' temperatureInput1, colour-banded),
    // occupancy (presence/motion → green ring on the icon + "Occupied"),
    // lights-on count, calling-for-heat flame and open-window count. Keyed off
    // the tile's room.html?room= link + rooms.json, so no per-tile markup.
    // Build the Rooms tile wall from rooms.json — alphabetical, icon chosen by
    // room-name keyword with a neutral fallback, description from which
    // sections the room actually has. the live poll used to fill them with
    // state afterwards exactly as before (it keys off the tiles' hrefs).


    function renderAlertsCard(devices) {
        const el = document.getElementById("alerts-strip");
        if (!el) return;
        if (!ROOMS) { el.innerHTML = `<h3>Alerts</h3><div class="muted">Loading…</div>`; return; }
        const allWinIds = new Set();
        for (const r of Object.values(ROOMS.rooms || {})) {
            (r.windows || []).forEach(id => allWinIds.add(id));
        }
        const contacts = devices.filter(d => allWinIds.has(d.id));
        // Readable = enabled, no errorState, a real boolean. Anything else is
        // UNKNOWN, and "All 12 closed" must never be asserted over a sensor
        // that cannot report (v2.95.3).
        const readable = contacts.filter(d => d.enabled !== false && !(d.errorState || "").trim()
                                           && typeof d.onState === "boolean");
        const unreadable = contacts.length - readable.length;
        const open = readable.filter(d => d.onState === true)
                             .sort((a, b) => (Date.parse(b.lastChanged || 0) || 0) - (Date.parse(a.lastChanged || 0) || 0));
        if (!open.length) {
            el.innerHTML = `<h3>Doors & Windows</h3>
                <div class="row"><span class="ok">${DashIcons.svg("check")} All ${readable.length} closed${unreadable ? ` · ${unreadable} unreadable` : ""}</span></div>`;
            return;
        }
        const items = open.map(d => `
            <div class="alert-open">
                <span class="name">${escapeAttr(d.name)}</span>
                <span class="when warn">${escapeAttr(relTime(d.lastChanged))}</span>
            </div>`).join("");
        el.innerHTML = `<h3>Doors & Windows · ${open.length} open</h3>${items}`;
    }

    // ── Favourites (v2.10.0): one-tap tiles at the top of the hub ─────
    // Driven by window.INDIGO_CONFIG.favourites (published in config.js):
    // [{type:"device"|"scene"|"door", id, label}]. Device tiles show live
    // on/off and toggle on tap; scene tiles run the action group; door tiles
    // (v2.76.0) are state-driven and pick open/close from the state shown.
    // Re-rendered each poll; a single delegated click handler
    // (setupFavourites) survives the re-render.

    // Last settled end state ("open"/"closed") per door favourite, so a
    // moving door can be named as Opening… or Closing…. Module-level on
    // purpose: the card's DOM is torn down every 3 s poll.
    const _doorLast = new Map();

    function renderFavouritesCard(devices) {
        const host = document.getElementById("favourites");
        if (!host) return;
        const allFavs = (window.INDIGO_CONFIG || {}).favourites || [];
        if (!allFavs.length) { host.style.display = "none"; return; }
        // Room shortcuts are navigation, not state, so they get their own row
        // under the live tiles rather than being mixed in among them.
        const roomFavs = allFavs.filter(f => f && f.type === "room");
        const favs     = allFavs.filter(f => f && f.type !== "room");
        const byId = new Map(devices.map(d => [d.id, d]));
        const tiles = favs.map(f => {
            if (f.type === "scene") {
                const name = f.label || "Scene";
                // data-dsh-act-key lets DashAction repaint an in-flight takeover
                // back onto this tile after the 3s rebuild below wipes it.
                // No "Run" sub-label: the takeover covers the whole tile the
                // moment it is pressed, so the tile only needs to say what it is.
                return `<button class="fav-tile fav-scene" data-fav-type="scene" data-fav-id="${escapeAttr(f.id)}" data-dsh-act-key="scene:${escapeAttr(f.id)}">
                    <span class="fav-name">${escapeAttr(name)}</span></button>`;
            }
            // Door favourite (v2.76.0): ONE tile that paints itself from the
            // door device's state and fires the direction-safe action for the
            // state it is showing. White closed / blue moving / red open /
            // amber stuck; presses are ignored mid-travel and when the state
            // is unknown (an absent device must never read as "Closed").
            // v2.77.0: a lockId makes it a LOCK-flavoured door (front door) —
            // contact device + lock device, white Locked / blue Unlocked /
            // red Open, press fires the unlock only from Locked.
            if (f.type === "door") {
                const did = Number(f.id);
                const d = byId.get(did);
                let t = { key: "unknown", label: "—", intent: null };
                if (f.lockId) {
                    const lk = byId.get(Number(f.lockId));
                    const contactRaw = (d && d.states) ? d.states[f.state || "onOffState"] : undefined;
                    const lockRaw = (lk && lk.states) ? lk.states.onOffState : undefined;
                    if (window.DashAction && DashAction.lockTile) t = DashAction.lockTile(contactRaw, lockRaw);
                } else {
                    const raw = (d && d.states) ? d.states[f.state || "doorState"] : undefined;
                    if (window.DashAction && DashAction.doorTile) t = DashAction.doorTile(raw, _doorLast.get(did));
                    const s = (raw == null) ? "" : String(raw).trim().toLowerCase();
                    if (s === "open" || s === "closed") _doorLast.set(did, s);
                }
                const dname = f.label || (d && d.name) || "Door";
                return `<button class="fav-tile fav-door fav-door-${t.key}" data-fav-type="door" data-fav-id="${escapeAttr(f.id)}" data-door-intent="${t.intent || ""}" data-dsh-act-key="door:${escapeAttr(f.id)}">
                    <span class="fav-name">${escapeAttr(dname)}</span>
                    <span class="fav-state">${escapeAttr(t.label)}</span></button>`;
            }
            // Group favourite (v2.93.0): ONE tile standing for several devices.
            // The living room's three lamps and the fire behind a single press,
            // with the colour lamp asked for 100% rather than whatever
            // brightness it was left on. State and direction come from the pure
            // DashAction.groupTile — an unreadable member (the RF fire) is
            // counted in the label but never decides which way a press goes.
            if (f.type === "group") {
                const t = (window.DashAction && DashAction.groupTile)
                    ? DashAction.groupTile(f.devices, byId)
                    : { key: "unknown", label: "—", intent: "on" };
                const gname = f.label || "Group";
                return `<button class="fav-tile fav-group fav-group-${t.key}${t.key === "on" ? " on" : ""}" data-fav-type="group" data-fav-idx="${escapeAttr(String(allFavs.indexOf(f)))}" data-group-intent="${escapeAttr(t.intent)}" data-dsh-act-key="group:${escapeAttr(gname)}">
                    <span class="fav-name">${escapeAttr(gname)}</span>
                    <span class="fav-state">${escapeAttr(t.label)}</span></button>`;
            }
            const d = byId.get(f.id);
            // Reading favourite (v2.19.0): a read-only value tile for a chosen
            // device state (e.g. voltage, temperature, SOC) — no on/off toggle.
            if (f.state) {
                const st = (d && d.states) || {};
                const raw = (st[f.state + ".ui"] != null && st[f.state + ".ui"] !== "") ? st[f.state + ".ui"]
                          : (st[f.state] != null ? st[f.state] : null);
                const valTxt = (raw == null || raw === "") ? "—" : String(raw);
                const rname = f.label || (d && d.name) || ("#" + f.id);
                // v2.77.0: optional colour bands. Compared against the RAW
                // numeric state, never the ".ui" string ("12.60 V" is not a
                // number). An unreadable value gets no colour, not a guess.
                let valCls = "";
                const wb = Number(f.warnBelow), bb = Number(f.badBelow);
                const num = Number(st[f.state]);
                if (Number.isFinite(num) && (Number.isFinite(wb) || Number.isFinite(bb))) {
                    if (Number.isFinite(bb) && num < bb) valCls = " fav-val-bad";
                    else if (Number.isFinite(wb) && num < wb) valCls = " fav-val-warn";
                    else valCls = " fav-val-good";
                }
                return `<button class="fav-tile fav-reading" data-fav-type="device" data-fav-id="${escapeAttr(f.id)}" data-fav-readonly="1">
                    <span class="fav-name">${escapeAttr(rname)}</span>
                    <span class="fav-state val${valCls}">${escapeAttr(valTxt)}</span></button>`;
            }
            // v2.92.1: a typed label WINS, as it already does on the door and
            // reading tiles. The old order put the live device name first, so a
            // label entered in Settings was stored and then silently ignored —
            // the field looked broken. With no label the live name still shows,
            // so an untouched favourite keeps following Indigo renames.
            const name = f.label || (d && d.name) || ("#" + f.id);
            const on = !!(d && d.onState === true);
            // A disabled device's state is frozen and a tap would be swallowed;
            // a device with no boolean state cannot be "Off" (v2.95.3).
            const dead = !!(d && d.enabled === false);
            const stateTxt = !d ? "—" : dead ? "Disabled"
                           : (typeof d.onState !== "boolean" ? "—" : (on ? "On" : "Off"));
            return `<button class="fav-tile${on ? " on" : ""}${dead ? " off-line" : ""}" data-fav-type="device" data-fav-id="${escapeAttr(f.id)}" data-fav-dead="${dead ? 1 : 0}" data-dsh-act-key="device:${escapeAttr(f.id)}">
                <span class="fav-name">${escapeAttr(name)}</span>
                <span class="fav-state">${stateTxt}</span></button>`;
        }).join("");
        // Rendered as ANCHORS, not buttons: a room shortcut is a link and
        // should behave like one — long-press to open in a new tab, and it
        // still works if the click handler ever stops being wired. The
        // readonly flag makes that handler step aside so the browser
        // navigates natively.
        const roomTiles = roomFavs.map(f => {
            const name = String(f.room || "");
            if (!name) return "";
            return `<a class="fav-tile fav-roomlink" data-fav-readonly="1"
                       href="room.html?room=${encodeURIComponent(name)}">
                <span class="fav-name">${escapeAttr(f.label || name)}</span>
                <span class="fav-state">Open room</span></a>`;
        }).join("");
        const markup = `<div class="fav-h">Favourites</div><div class="fav-grid">${tiles}</div>`
            + (roomTiles ? `<div class="fav-grid fav-grid-rooms">${roomTiles}</div>` : "");
        // Keep unchanged controls mounted through the poll. When a reading
        // changes, restore the focused favourite by identity, not its position.
        if (host.innerHTML !== markup) {
            const active = document.activeElement;
            const focused = active && host.contains(active) && active.matches(".fav-tile") ? active : null;
            const identity = el => [el.dataset.favType || "", el.dataset.favId || "", el.getAttribute("href") || ""].join("|");
            const focusedKey = focused ? identity(focused) : null;
            host.innerHTML = markup;
            if (focusedKey !== null) {
                const replacement = Array.from(host.querySelectorAll(".fav-tile")).find(el => identity(el) === focusedKey);
                if (replacement) replacement.focus({ preventScroll: true });
            }
        }
        host.style.display = "block";
        // Repaint any in-flight action takeover onto the tiles just rebuilt.
        // This card is torn down and recreated every 3 s poll, which is exactly
        // what killed the old "Done ✓" tick before it could be read.
        if (window.DashAction) DashAction.repaint();
    }

    let _favWired = false;
    function setupFavourites() {
        const host = document.getElementById("favourites");
        if (!host || _favWired) return;
        _favWired = true;
        host.addEventListener("click", async (ev) => {
            const tile = ev.target.closest(".fav-tile");
            if (!tile) return;
            if (tile.dataset.favReadonly) return;   // reading tiles don't toggle
            const type = tile.dataset.favType;

            // Group favourite (v2.93.0): several devices behind one press, so
            // it is handled before the device-id parse below — a group has no
            // id of its own. The direction was decided at RENDER time and is
            // carried on the tile, so what happens is what the tile said it
            // would do; the plan then commands EVERY member, including any the
            // poll already believes is in that state.
            if (type === "group") {
                const gfavs = (window.INDIGO_CONFIG || {}).favourites || [];
                const g = gfavs[parseInt(tile.dataset.favIdx, 10)];
                if (!g || g.type !== "group") return;
                const gkey = tile.dataset.dshActKey || ("group:" + (g.label || ""));
                const plan = (window.DashAction && DashAction.groupPlan)
                    ? DashAction.groupPlan(g.devices, tile.dataset.groupIntent || "on") : [];
                if (!plan.length) return;
                const gapi = new IndigoAPI();
                gapi.onAuthFailure(_onAuthFail);
                // One PIN prompt per press (v2.95.4): the members are commanded
                // in parallel and each used to hit the gate before the first
                // verify had stored the session flag, so N protected members
                // meant N prompts.
                const pinIds = (window.INDIGO_CONFIG || {}).pinRequired || [];
                const guarded = plan.map(c => c.id).find(id => pinIds.includes(id));
                if (guarded != null && gapi._gate) {
                    try { await gapi._gate(guarded); } catch (e) { return; }
                }
                tile.classList.add("busy");
                try {
                    const results = await Promise.allSettled(plan.map(c =>
                        c.fn === "setBrightness" ? gapi.setBrightness(c.id, c.level) : gapi[c.fn](c.id)));
                    // Say so when a member did not take the command. The old
                    // room-page pattern swallowed every rejection, so half a
                    // group going through looked exactly like all of it.
                    const bad = results.filter(r => r.status === "rejected").length;
                    if (bad) DashAction.note(gkey, "error",
                        bad === plan.length ? "Failed — no response"
                                            : `${bad} of ${plan.length} failed`);
                } finally {
                    tile.classList.remove("busy");
                }
                return;
            }

            const id   = parseInt(tile.dataset.favId, 10);
            if (isNaN(id)) return;
            const key = tile.dataset.dshActKey || (type + ":" + id);
            const indigo = new IndigoAPI();
            indigo.onAuthFailure(_onAuthFail);

            if (type === "scene") {
                // A scene tile can be a door. The HTTP call returning only means
                // Indigo accepted the action group — DashAction takes the tile
                // over and holds it until the contact sensors say it happened,
                // or until it gives up and says so.
                await DashAction.run({ api: indigo, key, actionId: id,
                                       title: tile.querySelector(".fav-name")?.textContent || "" });
                return;
            }

            if (type === "door") {
                // State-driven press: fire the action for the state the tile
                // is SHOWING. No intent (moving / unknown) = display-only —
                // pulsing an opener mid-travel stops or reverses it
                // unpredictably, so the tile refuses rather than guesses.
                // Direction safety does not rest on this tile being fresh:
                // both plugin actions are idempotent, so a ≤3 s-stale read
                // can only ever no-op, never reverse the door.
                const intent = tile.dataset.doorIntent;
                if (!intent) return;
                const favs = (window.INDIGO_CONFIG || {}).favourites || [];
                const f = favs.find(x => x.type === "door" && Number(x.id) === id);
                const actionId = f ? Number(intent === "open" ? f.openAction : f.closeAction) : NaN;
                if (!actionId || isNaN(actionId)) return;
                // Door theme: blue in-flight veil, and holdDone 0 clears the
                // veil the moment travel confirms — the tile itself turning
                // red "Open" or white "Closed" IS the confirmation. Failure
                // veils (timeout / stuck / error) keep their long holds.
                const spec = DashAction.watchSpec(actionId);
                await DashAction.run({ api: indigo, key, actionId,
                                       spec: spec ? Object.assign({}, spec, { theme: "door", holdDone: 0 }) : null,
                                       title: tile.querySelector(".fav-name")?.textContent || "" });
                return;
            }

            if (tile.dataset.favDead === "1") {
                try { DashAction.note(tile.dataset.dshActKey, "error", "Disabled in Indigo"); } catch (_) {}
                return;
            }
            tile.classList.add("busy");
            try {
                await indigo.toggle(id);
                // Optimistic flip for instant feedback; the next 3s poll re-syncs from the server.
                tile.classList.toggle("on");
                const st = tile.querySelector(".fav-state");
                if (st) st.textContent = tile.classList.contains("on") ? "On" : "Off";
            } catch (e) {
                // Auth failure is handled by _onAuthFail. Everything else used to
                // vanish here, so a dead network looked exactly like success.
                if (e && e.name !== "AbortError") {
                    DashAction.note(key, "error", "Failed — " + ((e && e.message) || "no response"));
                }
            } finally {
                tile.classList.remove("busy");
            }
        });
    }

    function showConfigForm() {
        // baseURL comes from config.js (merged by dashboards-auth.js) so the
        // field is pre-filled; only the API key needs typing. The key is kept
        // in this browser's localStorage and is never published by the server.
        const defaultURL = (window.INDIGO_CONFIG || {}).baseURL || location.origin;
        document.getElementById("content").innerHTML = `
            <div id="config-form">
                <h2>Connect to Indigo</h2>
                <p>Enter your Indigo API key. It is saved in this browser only —
                   the server never publishes it.</p>
                <label>Server URL
                    <input id="cfg-url" type="url" placeholder="${escapeAttr(defaultURL)}"
                           value="${escapeAttr(defaultURL)}">
                </label>
                <label>API Key
                    <input id="cfg-key" type="password" autocomplete="current-password"
                           placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
                </label>
                <button onclick="connect()">Connect</button>
                <p>Already paired in an Indigo app? It'll inject credentials automatically — refresh this page.</p>
            </div>`;
    }

    function connect() {
        const baseURL = document.getElementById("cfg-url").value.replace(/\/+$/, "");
        const apiKey  = document.getElementById("cfg-key").value.trim();
        if (!baseURL || !apiKey) return;
        IndigoAPI.saveConfig({ baseURL, apiKey });
        location.reload();
    }

    function resetConfig() {
        if (!confirm("Forget Indigo server credentials?")) return;
        IndigoAPI.clearConfig();
        location.reload();
    }

    // House pulse (v2.18.0, moved into the hero v2.30.0): a row of chips — who's
    // home (UniFi presence), zones calling for heat (RAMSES hvacHeaterIsOn),
    // low-battery / device-error counts, and the live grid-carbon reading. Each
    // chip deep-links to its page. All device chips come from the 3s poll.
    function renderHousePulse(devices) {
        const el = document.getElementById("pulse-row");
        if (!el) return;
        // Per-person presence (v2.34.0): one chip each, Home OR Away — so an
        // away person is visibly away rather than just missing from a list.
        const people = devices
            .filter(d => d.deviceTypeId === "unifiClient")
            .map(d => ({
                name: String(d.name || "").replace(/^Presence\s*[-–]\s*/, "")
                        .replace(/\s+iPhone.*$/i, "").trim() || String(d.name || ""),
                home: (d.states || {}).presence === "home",
            }))
            .sort((a, b) => a.name.localeCompare(b.name));
        const heating = devices.filter(d => asBool((d.states || {}).hvacHeaterIsOn)).length;
        let lowBatt = 0, errors = 0;
        for (const d of devices) {
            if (d.enabled === false) continue;
            const s = d.states || {};
            let pct = null;
            if (typeof d.batteryLevel === "number") pct = d.batteryLevel;
            else if (s.battery != null && !isNaN(parseFloat(s.battery))) pct = parseFloat(s.battery);
            if (pct != null && pct > 0 && pct < 20) lowBatt++;
            else if (asBool(s.batteryLow)) lowBatt++;
            if (d.errorState && d.errorState !== "") errors++;
        }
        const chip = (href, cls, inner) =>
            `<a class="pulse-chip ${cls}" href="${href}">${inner}</a>`;
        const chips = [];
        if (people.length) {
            for (const p of people.slice(0, 6)) {
                chips.push(chip("presence.html", p.home ? "good" : "",
                    `${DashIcons.svg("person")} ${escapeAttr(p.name)} · ${p.home ? "Home" : "Away"}`));
            }
        } else {
            chips.push(chip("presence.html", "", DashIcons.svg("person") + " No presence devices"));
        }
        chips.push(chip("heating.html", heating ? "warn" : "",
            `${DashIcons.svg("flame")} <span class="pc-num">${heating}</span> zone${heating === 1 ? "" : "s"} heating`));
        if (lowBatt) chips.push(chip("system-health.html", "warn",
            `${DashIcons.svg("battery")} <span class="pc-num">${lowBatt}</span> low battery`));
        if (errors)  chips.push(chip("system-health.html", "bad",
            `${DashIcons.svg("warn")} <span class="pc-num">${errors}</span> in error`));
        // VPP chip (v2.66.0) — replaced the grid-carbon chip, which CliveS does
        // not use. Shown ONLY while an Axle window is announced or running, so
        // the row stays short on the days nothing is happening: an always-on
        // "VPP idle" chip would be noise 364 days a year. The Carbon page is
        // untouched and still linked from the tile wall.
        const vpp = (_sigen() && _sigen().vpp) || null;
        if (vpp && vpp.active) {
            chips.push(chip("energy.html", "warn",
                `${DashIcons.svg("bolt")} VPP running${vpp.event_str ? " · " + escapeAttr(vpp.event_str) : ""}`));
        } else if (vpp && vpp.state === "announced") {
            chips.push(chip("energy.html", "good",
                `${DashIcons.svg("bolt")} VPP announced${vpp.event_str ? " · " + escapeAttr(vpp.event_str) : ""}`));
        }
        el.innerHTML = chips.join("");
    }

    // Power-cut / storm banner (v2.18.0): shown only when the cached Sigen data
    // reports an ongoing grid outage or an active storm export-hold.
    function renderBanner() {
        const el = document.getElementById("house-banner");
        if (!el) return;
        const d = _sigen();
        const pc = (d && d.power_cut) || {};
        const st = (d && d.storm) || {};
        // "export held" only when export is ACTUALLY suppressed — the lockout
        // window alone doesn't stop export above the SOC floor (same lesson as
        // the energy page's v2.15.1 chip fix).
        let msg = "", cls = "";
        if (pc.ongoing)                 { msg = DashIcons.svg("bolt") + " GRID POWER CUT — running on battery"; cls = "bad"; }
        else if (pc.export_suppressed)  { msg = DashIcons.svg("bolt") + " Recent power cut — battery reserved, export held"; cls = "warn"; }
        else if (pc.lockout_active)     { msg = DashIcons.svg("bolt") + " Recent power cut — battery reserve raised"; cls = "warn"; }
        else if (st.export_suppressed)  { msg = DashIcons.svg("storm") + " Storm watch — export held to keep the battery charged"; cls = "warn"; }
        if (msg) { el.innerHTML = msg; el.className = cls; el.style.display = "block"; }
        else     { el.style.display = "none"; }
    }

    // A SINGLE transient 401/403 (an IWS restart, a proxy hiccup) used to
    // wipe the stored key and bounce the tab to the pairing form. Three
    // consecutive failures is a real credential problem; anything less rides
    // it out. Reset on every successful fetch.
    // The four side pollers (sigen, string hours, insights, log watch) fetch
    // directly rather than through IndigoAPI, so they never reached the
    // auth-failure counter below. A browser holding a stale key therefore
    // asked again every 30 s for ever, and every refusal wrote a Web Server
    // warning — 120 lines an hour, per open tab, for a key that was never
    // going to start working. They now report a refusal like everything else,
    // so three of them trip the same re-pair flow.
    function _authRefused(r) {
        if (!r || (r.status !== 401 && r.status !== 403)) return false;
        try { _onAuthFail(); } catch (_) { /* never let this break a poller */ }
        return true;
    }

    // Every raw /message/ poll on this page goes through here (v2.95.3): a
    // 12 s timeout so an IWS slowdown cannot leave a request hanging for the
    // browser's default minutes, and one request in flight per path so a slow
    // reply is never stacked behind by the next interval. A poll refused for
    // being in flight returns a not-ok stand-in, which every caller already
    // treats as "nothing this time".
    const _msgInflight = new Set();
    async function _msg(path, body, timeoutMs = 12000) {
        if (_msgInflight.has(path)) return { ok: false, status: 0, inflight: true };
        const key = (window.INDIGO_CONFIG || {}).apiKey || "";
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        _msgInflight.add(path);
        try {
            return await fetch(path, {
                method: "POST",
                headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
                body: body, signal: ctrl.signal,
            });
        } finally {
            clearTimeout(timer);
            _msgInflight.delete(path);
        }
    }

    let _authFails = 0;
    function _onAuthFail() {
        _authFails += 1;
        if (_authFails < 3) return;
        IndigoAPI.clearConfig();
        setTimeout(() => location.reload(), 1500);
    }

    let _summaryBusy = false;
    // Say so when the page is reached through the Indigo reflector, and
    // offer the LAN address (v2.96.1). A reflector-origin phone at home is
    // invisible from the phone's side — the page looks identical.
    function _reflectorNote() {
        const el = document.getElementById("reflector-note");
        if (!el || el.hidden === false || !window.DashUI || DashUI.linkClass() !== "reflector") return;
        const lan = DashUI.lanUrl ? DashUI.lanUrl("index.html") : "";
        el.innerHTML = "Reached through the Indigo reflector, which Indigo's own servers carry — "
            + "pictures refresh every 15 s here and pause when nobody touches the page."
            + (lan ? ` At home, use <a href="${escapeAttr(lan)}">${escapeAttr(lan)}</a> instead.` : "");
        el.hidden = false;
    }
    async function loadSummary() {
        _reflectorNote();
        if (document.hidden || _summaryBusy) return;
        _summaryBusy = true;
        const indigo = new IndigoAPI();
        indigo.onAuthFailure(_onAuthFail);
        try {
            const devices = await indigo.getDevices();
            _authFails = 0;
            // Served from cache while the plugin is down: the one outage
            // signal this page has is the clock going stale — keep it stale.
            if (!devices.fromCache) markRefreshed();
            // Feed any in-flight action watch from the poll we already ran, so
            // confirming a door costs no extra network traffic.
            try { DashAction.tick(devices); } catch (e) { console.warn("action watch", e); }
            // Drive the command-centre cards from the same device fetch.
            try { renderFavouritesCard(devices); } catch (e) { console.warn("favourites card", e); }
            try { renderEnergyCard(devices);  } catch (e) { console.warn("energy card", e); }
            // _leanHub has been a constant false since the light hub was
            // removed in v2.97.0. The guard is kept because it is the one
            // place that says these two are the expensive renders, and it
            // costs nothing while it is always true.
            if (!_leanHub) {
                try { renderWeatherCard(devices); } catch (e) { console.warn("weather card", e); }
                // Its own card now, so it no longer depends on the weather
                // shell existing first — but it is still rendered on the same
                // poll, from the same Sigen payload.
                try { renderWeatherSolar(); } catch (e) { console.warn("solar card", e); }
            }
            try { renderHousePulse(devices);  } catch (e) { console.warn("house pulse", e); }
            try { renderBanner();             } catch (e) { console.warn("banner", e); }
            if (!_leanHub) {
                try { renderAlertsCard(devices);  } catch (e) { console.warn("alerts card", e); }
            }
        } catch (e) {
            // Errors surface via stale topbar timestamp + auth-failure handler above.
        } finally {
            _summaryBusy = false;
        }
    }
    </script>

    <footer class="bottombar">
        <div class="bottombar-inner">
            Updated <span id="ts-bot">—</span> · live every 3s
        </div>
    </footer>



    <button class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">↑</button>
    <script>
        (function() {
            const btn = document.querySelector(".back-to-top");
            if (!btn) return;
            const onScroll = () => {
                if (window.scrollY > 200) btn.classList.add("visible");
                else btn.classList.remove("visible");
            };
            window.addEventListener("scroll", onScroll, { passive: true });
            onScroll();
        })();
    </script>
