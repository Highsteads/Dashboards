                clearTimeout(st.webrtcDiscTimer);
                st.webrtcDiscTimer = setTimeout(() => {
                    if (st.gen === gen && pc.connectionState === "disconnected") dead("connection disconnected");
                }, 5000);
            } else if (pc.connectionState === "connected") {
                clearTimeout(st.webrtcDiscTimer);
            }
        });
        st.webrtcIceTimer = setTimeout(() => {
            if (st.gen === gen && pc.connectionState !== "connected") {
                dead(`no connection in ${WEBRTC_ICE_MS / 1000}s`);
            }
        }, WEBRTC_ICE_MS);
        st.webrtcFrameTimer = setTimeout(() => {
            if (st.gen === gen && !st.webrtcGotFrame) {
                dead(`no frame in ${WEBRTC_FRAME_MS / 1000}s`);
            }
        }, WEBRTC_FRAME_MS);
        const firstFrame = () => {
            if (st.gen !== gen || st.mode !== "webrtc") return;
            if (st.webrtcGotFrame) return;       // two triggers race; first wins
            st.webrtcGotFrame = true;
            st.webrtcFails    = 0;               // a working stream forgives the past
            st.lastChangeAt   = Date.now();
            st.lastVideoTime  = 0;
            st.frameEl.classList.add("has-image");
            st.frameEl.classList.remove("connecting");
            st.frameEl.classList.remove("error");
            st.imgEl.style.display = "none";     // video owns the frame now
            st.dotEl.classList.remove("bad");
            st.dotEl.classList.remove("stale");
            st.dotEl.classList.add("ok");
            markRefreshed();                     // a real frame arrived
        };
        // TWO triggers for "the first frame is here", because they cover
        // different truths: requestVideoFrameCallback fires on a COMPOSITED
        // frame — the visual moment — but a hidden or occluded page
        // composites nothing, so on it a healthy stream would sit
        // "connecting" until the no-frame timer wrongly killed it (found
        // live: the pane's hidden tab decoded 720p happily while rVFC
        // stayed silent). timeupdate fires whenever the MEDIA CLOCK
        // advances, visible or not. First one wins; firstFrame is
        // idempotent.
        if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(firstFrame);
        video.addEventListener("timeupdate", () => {
            if (video.currentTime > 0) firstFrame();
        });
        (async () => {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            // Host-only candidates gather in milliseconds; cap the wait.
            await new Promise((r) => {
                if (pc.iceGatheringState === "complete") return r();
                pc.addEventListener("icegatheringstatechange", () => {
                    if (pc.iceGatheringState === "complete") r();
                });
                setTimeout(r, 1000);
            });
            st.webrtcAbort = new AbortController();
            const r = await fetch(webrtcUrl(host), {
                method: "POST",
                headers: { "Content-Type": "application/sdp" },
                body: pc.localDescription.sdp,
                signal: st.webrtcAbort.signal,     // stopWebrtc cancels a fallback's orphaned offer
            });
            if (!r.ok) throw new Error(`signalling ${r.status}`);
            await pc.setRemoteDescription({ type: "answer", sdp: await r.text() });
        })().catch((e) => dead(e && e.message ? e.message : "negotiation failed"));
        setMode(host, "webrtc");
        if (st.bwEl) st.bwEl.style.visibility = "visible";
    }

    function startLive(host) {
        const st = camState[host]; if (!st) return;
        clearTileTimers(st);
        stopWebrtc(st);             // leaving webrtc mode: close the pc, restore the img
        releaseFrameUrl(st);        // leaving still mode: hand the blob back
        st.mode   = "live";
        st.paused = false;
        st.frameEl.classList.remove("paused");
        st.frameEl.classList.add("connecting");
        const img = replaceImg(st);
        img.src = mjpegUrl(host) + "?_t=" + Date.now();

        // Safety timeout: if the MJPEG hasn't delivered a frame in 10s the
        // socket is probably stuck somewhere upstream. Drop the tile to
        // still polling so it shows something rather than CONNECTING… forever.
        if (st.liveTimeout) clearTimeout(st.liveTimeout);
        st.liveTimeout = setTimeout(() => {
            if (camState[host]?.mode === "live"
                && camState[host].frameEl.classList.contains("connecting")) {
                // Route through degradeToStill rather than a bare startStill:
                // the bare call left autoDegraded unset, so the watchdog's
                // retry ladder never looked at this tile again and one missed
                // 10 s window meant stills until the next re-layout.
                degradeToStill(host, "MJPEG didn't connect in 10s");
            }
        }, 10000);

        setMode(host, "live");
        if (st.bwEl) st.bwEl.style.visibility = "visible";
        // No markRefreshed here: STARTING a stream is not a frame. The first
        // real frame stamps the clock from onFrameLoad.
    }
    function startStill(host) {
        const st = camState[host]; if (!st) return;
        const wasLive = st.mode === "live";
        clearTileTimers(st);
        stopWebrtc(st);             // no-op unless leaving webrtc mode
        st.mode   = "still";
        st.paused = false;
        st.frameEl.classList.remove("paused");
        st.frameEl.classList.remove("connecting");
        // If we're coming from live (multipart MJPEG), replace the img element
        // to fully tear down the connection. For still→still this is unnecessary
        // and would just churn DOM, so skip it.
        const img = wasLive ? replaceImg(st) : st.imgEl;
        img.crossOrigin = "anonymous";
        // Re-attach the canonical handlers unconditionally: a tile resuming
        // from paused had them detached (see pauseTile) and skips replaceImg,
        // so without this it would never report a frame again.
        if (st.onFrameLoad)  img.onload  = st.onFrameLoad;
        if (st.onFrameError) img.onerror = st.onFrameError;

        // Load the next frame into a DETACHED image and only swap it in once it
        // has actually decoded. Assigning straight to the visible img.src blanks
        // the tile for the whole fetch — about 5 ms at home, but MEASURED at
        // 756 ms for one snapshot over the reflector and 1780 ms when all nine
        // go at once, against a 3 s refresh. That left every tile empty for most
        // of each cycle, which is exactly the "cameras stop when I'm away"
        // report: not a stall, the tiles were mid-reload nearly all the time.
        // Holding the last good frame until the new one is ready means a slow
        // link now costs latency instead of blanking.
        // ASK, DON'T GUESS. The snapshot is refetched on a conditional request:
        // we send back the Last-Modified we already hold, and IWS answers
        // "304 Not Modified" in 53 BYTES when the frame has not changed, or
        // ships the new one (~21 KB) when it has. That is what lets the tile
        // poll far faster than the ~2 s at which frames are actually produced
        // without paying for it — the old code appended "?t=<now>", so every
        // URL was unique, the browser could never revalidate, and every single
        // poll cost a whole frame. It is as close to being TOLD about a new
        // frame as you can get without holding a connection open, which
        // matters here: plugin handlers all share one thread, so a long-lived
        // push stream would freeze the entire plugin.
        //
        // Explicit fetch rather than an <img> because JS has to SEE the 304 —
        // and because with a stable URL, assigning the same src to the visible
        // <img> is a no-op, so it would keep showing the frame it had.
        const fetchFrame = () => {
            // SKIP if the previous poll has not come back. The reflector is
            // HTTP/1.1, so the browser allows 6 connections per origin; nine
            // tiles polling every second over a 0.9 s link ask for more than
            // that and the surplus queues. A queued poll is worthless — by the
            // time it is answered its frame is stale — and a growing queue is
            // exactly how the live MJPEG tiles ended up 30 s behind. Skipping
            // means a slow link quietly polls less often rather than building a
            // backlog it can never drain.
            if (_idlePaused) return Promise.resolve();   // reflector, ten idle minutes: nothing until a tap (v2.96.1)
            if (st.fetching) return Promise.resolve();
            st.fetching = true;
            // Time-box the request. Without this a wedged socket holds the
            // in-flight guard above forever and the tile just stops.
            const ctrl = new AbortController();
            const abortTimer = setTimeout(() => ctrl.abort(), STILL_FETCH_TIMEOUT_MS);
            const full = wantsFullSize(host);
            // The two sizes are DIFFERENT FILES, so the timestamp we hold for
            // one says nothing about the other — and because both are written
            // in the same pass their timestamps are within a second of each
            // other, which is exactly close enough to produce a wrong "nothing
            // new" and leave a promoted tile showing its thumbnail. Forget it
            // whenever the size changes.
            if (st.srcFull !== full) { st.srcFull = full; st.lastMod = null; }
            const headers = st.lastMod ? { "If-Modified-Since": st.lastMod } : {};
            // no-store so the browser cannot answer from its own cache and hide
            // the 304 from us; our conditional header IS the caching.
            return fetch(snapshotUrl(host, full),
                         { cache: "no-store", headers, signal: ctrl.signal })
                .then(r => {
                    if (r.status === 304) return null;      // nothing new: 53 bytes
                    if (r.status === 404 && !full) {
                        // No thumbnail on the server. Stop asking for one, on
                        // every tile, and come back for the full-size picture
                        // on the next tick rather than sitting blank.
                        thumbsAvailable = false;
                        return null;
                    }
                    if (!r.ok) { _stillFailed(st, "HTTP " + r.status); return null; }   // keep the last good frame, but count it
                    st.lastMod = r.headers.get("Last-Modified") || st.lastMod;
                    // Parsed copy for the age readout. Kept separate from
                    // st.lastMod (the conditional-request bookkeeping) and
                    // only promoted to frameModMs once the frame is actually
                    // delivered below — a 304 or an error must not re-date
                    // the picture already on screen.
                    st._mod200 = Date.parse(r.headers.get("Last-Modified") || "");
                    return r.blob();
                })
                .then(blob => {
                    if (!blob) return;
                    _stillOk(st);
                    // Count what THIS PAGE actually pulled down. The old total
                    // read go2rtc's bytes_recv, which is what the SERVER pulls
                    // from the cameras over the house LAN — nothing to do with
                    // this device. It read 3.0 MB/s on a phone that was really
                    // using about 130 kB/s, which is exactly the wrong way to be
                    // wrong when someone is watching their mobile data.
                    _rxBytes += blob.size;
                    st.lastFrameAt = Date.now();
                    // A real frame arrived: date it, feed the skew tell, and
                    // stamp the page-wide Updated clock — this is the ONLY
                    // place a still may stamp it.
                    if (st._mod200 != null && !isNaN(st._mod200)) {
                        st.frameModMs = st._mod200;
                        noteAgeAtReceipt(st.lastFrameAt - st.frameModMs);
                    }
                    markRefreshed();
                    if (st.mode !== "still" || st.paused) return;   // mode changed mid-fetch
                    const url = URL.createObjectURL(blob);
                    const done = () => {
                        // Revoke the PREVIOUS object URL only once the new one is
                        // decoded, or the tile blanks between the two.
                        if (st.objUrl) URL.revokeObjectURL(st.objUrl);
                        st.objUrl = url;
                    };
                    img.addEventListener("load", done, { once: true });
                    img.addEventListener("error", () => URL.revokeObjectURL(url), { once: true });
                    img.src = url;
                    st.frames = (st.frames || 0) + 1;
                })
                .catch(e => { _stillFailed(st, (e && e.name === "AbortError") ? "timed out" : "unreachable"); })
                .finally(() => { st.fetching = false; clearTimeout(abortTimer); });
        };
        // The RECURRING fetch skips a hidden tab — no point spending someone's
        // mobile data on frames nobody is looking at. The FIRST one never
        // skips: a page opened in a background tab, or backgrounded while it
        // loads, must still have a frame ready the moment it is looked at.
        // Gating the initial paint on document.hidden left every tile blank
        // until the next tick, which is how this was caught.
        // Returns the fetch's promise so the chain below can wait for it. A
        // hidden tab does no work and resolves at once, which keeps the chain
        // ticking over without sending anything.
        const refresh = () => (document.hidden ? Promise.resolve() : fetchFrame());
        fetchFrame();
        // Auto-degraded tiles poll slower — the link that couldn't carry MJPEG
        // won't thank us for a 2s snapshot either.
        const period = st.autoDegraded ? DEGRADED_POLL_MS
                     : LINK === "home" ? POLL_MS
                     : LINK === "reflector" ? (host === focusedHost ? REFLECTOR_FOCUS_MS : REFLECTOR_POLL_MS)
                     : host === focusedHost ? FOCUS_POLL_MS
                                            : REMOTE_POLL_MS;
        // STAGGER the tiles across the period. Fired together, nine requests
        // queue against the browser's ~6-per-origin cap and the last few are
        // still in flight when the next tick cancels them — measured live, three
        // tiles never completed a single load over the reflector. Spreading them
        // keeps at most a couple in flight at once.
        const slot = hosts.indexOf(host);
        const offset = slot < 0 ? 0 : Math.round(period * (slot / Math.max(hosts.length, 1)));

        // SELF-SCHEDULING, not setInterval. A fixed interval fires on its own
        // beat regardless of whether the last request has come back, and the
        // in-flight guard then has to throw the tick away — so a fetch that
        // overruns costs a WHOLE period, not the few milliseconds it actually
        // overran by. At a 1 s interval over a link with a ~0.9 s round trip
        // that is marginal by design: ordinary jitter drops a tick, the next
        // one lands 2 s later, and the refresh rate visibly sawtooths. Reported
        // as "jumping between 3 and 7 seconds", and measured NOT to be the
        // server — over three minutes the snapshot files were rewritten 797
        // times at a mean of 2.04 s with no gap longer than 2.5 s.
        //
        // Scheduling the next poll from the moment the last one FINISHES keeps
        // the cadence smooth at any link speed: fast link, it waits out the
        // remainder of the period; slow link, it goes again after MIN_GAP_MS
        // instead of skipping a beat. It also cannot overlap itself, so there
        // is no pile-up to guard against in the first place.
        const gen = (st.gen = (st.gen || 0) + 1);
        const tick = () => {
            if (st.gen !== gen) return;            // a newer chain owns this tile
            const began = Date.now();
            Promise.resolve(refresh()).catch(() => {}).then(() => {
                if (st.gen !== gen || st.mode !== "still" || st.paused) return;
                const spent = Date.now() - began;
                st.stillTimer = setTimeout(tick, Math.max(MIN_GAP_MS, period - spent));
            });
        };
        st.stillDelay = setTimeout(tick, offset);
        setMode(host, "still");
        // Hide the kB/s number on stills — snapshot bandwidth is trivial and
        // we'd just show ~0 for every thumbnail.
        if (st.bwEl) st.bwEl.style.visibility = "hidden";
    }
    // ── Slow-link degrade / restore ────────────────────────────
    // Drop a stalled live tile to still-polling. Remembers that it was an
    // AUTOMATIC drop (not a user/layout choice) so we know to try live again,
    // and backs the retry off so a persistently bad link doesn't thrash the
    // connection every minute.
    function degradeToStill(host, why) {
        const st = camState[host]; if (!st) return;
        st.degradeCount  = (st.degradeCount || 0) + 1;
        st.degradesSinceRecovery = (st.degradesSinceRecovery || 0) + 1;   // reset by a recovery, counted towards parking (v2.95.4)
        st.autoDegraded  = true;
        st.degradedAt    = Date.now();
        st.retryAfterMs  = Math.min(LIVE_RETRY_BASE_MS * st.degradeCount, LIVE_RETRY_MAX_MS);
        console.warn(`[cameras] ${host} ${why} — falling back to ${DEGRADED_POLL_MS/1000}s stills`
                     + ` (retry live in ${Math.round(st.retryAfterMs/1000)}s)`);
        startStill(host);
        setMode(host, "still");
    }
    // Which tiles are entitled to hold a live stream right now. With a pool of
    // one the entitlement FOLLOWS THE FOCUS, so it cannot be answered from the
    // fixed DEFAULT_LIVE_SET: that set holds only hosts[0], which off-LAN gave
    // both halves of one bug — a focused tile promoted by focusTile() could
    // never regain live after a stall (the watchdog logged "retrying" every
    // 1.5s while this gate silently refused), and hosts[0], demoted by a
    // handover but still carrying autoDegraded, could restore ITSELF behind
    // the user's back — two MJPEG sockets at once on the one link where that
    // is exactly what we are avoiding.
    function mayHoldLive(host) {
        if (LIVE_FOLLOWS_FOCUS) return host === (focusedHost || DEFAULT_LIVE[0]);
        return DEFAULT_LIVE_SET.has(host);
    }
    // Periodically give live another go. If the link has recovered the watchdog
    // simply never fires again and the tile stays live; if it hasn't, we degrade
    // again with a longer backoff.
    function tryRestoreLive(host) {
        const st = camState[host]; if (!st) return;
        if (st.paused || !mayHoldLive(host)) {
            // Not entitled any more (a handover moved the live slot). Stop the
            // retry timer chasing it, or the watchdog logs a retry every tick
            // for a tile it will never actually promote.
            st.autoDegraded = false;
            // Clearing the flag is not enough on its own: the running still
            // chain captured DEGRADED_POLL_MS in its closure, so without a
            // rebuild the tile keeps polling every 5 s indefinitely. Restart
            // it so the period is recomputed from the now-cleared flag.
            if (!st.paused && st.mode === "still") startStill(host);
            return;
        }
        st.lastSig     = null;
        st.lastChangeAt = Date.now();   // grace period before the watchdog can bite
        startLive(host);
    }

    function pauseTile(host) {
        const st = camState[host]; if (!st) return;
        clearTileTimers(st);
        stopWebrtc(st);             // a hidden tab must not hold a peer connection
        st.paused = true;
        st.mode   = "paused";
        // Closing the connection: set src to transparent pixel. The browser
        // keeps the last frame visible because we add the .paused overlay.
        // Capture a snapshot of the current frame first so the tile still
        // shows the last image instead of going black.
        //
        // Detach the frame handlers BEFORE touching src: both the captured
        // data-URL frame and the transparent pixel fire a synthetic onload,
        // and nine of those on every tab-hide painted green dots and stamped
        // the page-wide "Updated" clock with loads that never happened.
        // startStill/startLive re-attach the canonical handlers on resume.
        st.imgEl.onload  = null;
        st.imgEl.onerror = null;
        st.lastFrameDataUrl = null;          // this pause's capture, not an earlier one
        try { captureLastFrame(host); } catch (e) {}
        // The captured frame has already replaced the stream src (so the
        // socket is released); overwriting it with the transparent pixel
        // threw the capture away a line after making it (v2.95.4).
        if (!st.lastFrameDataUrl) st.imgEl.src = TRANSPARENT_PIXEL;
        st.frameEl.classList.add("paused");
        setMode(host, "paused");
        if (st.bwEl) st.bwEl.style.visibility = "hidden";
    }
    function captureLastFrame(host) {
        const st = camState[host]; if (!st) return;
        if (!st.imgEl.complete || !st.imgEl.naturalWidth) return;
        const c = document.createElement("canvas");
        c.width  = st.imgEl.naturalWidth;
        c.height = st.imgEl.naturalHeight;
        c.getContext("2d").drawImage(st.imgEl, 0, 0);
        try { st.lastFrameDataUrl = c.toDataURL("image/jpeg", 0.85); } catch (e) {}
        if (st.lastFrameDataUrl) {
            // Swap to the captured still so the tile shows the last frame even
            // after we drop the MJPEG connection.
            st.imgEl.src = st.lastFrameDataUrl;
        }
    }
    function setMode(host, mode) {
        const st = camState[host]; if (!st || !st.modeEl) return;
        // The still chip states the tile's ACTUAL period from the same ladder
        // startStill uses. It used to hardcode POLL_MS, so away tiles polling
        // at 1 s wore a "↻ 2s" badge — spotted on CliveS's own screenshots
        // while the footer said "@1s" beside it.
        const stillPeriod = st.autoDegraded ? DEGRADED_POLL_MS
                          : LINK === "home" ? POLL_MS
                          : host === focusedHost ? FOCUS_POLL_MS
                                                 : REMOTE_POLL_MS;
        const labels = {
            live:    "live",
            webrtc:  "live · rtc",
            // A tile dropped by the slow-link watchdog says so, so it's obvious
            // why it isn't moving and that it wasn't a configuration choice.
            still:   st.autoDegraded
                        ? "↻ " + (stillPeriod / 1000) + "s · slow link"
                        : "↻ " + (stillPeriod / 1000) + "s",   // e.g. "↻ 1s"
            off:     "off",
            paused:  "paused",
        };
        st.modeEl.textContent = labels[mode] || mode;
        st.modeEl.setAttribute("data-mode", mode);
    }

    // ── Snapshot download ──────────────────────────────────────
    function takeSnapshot(host) {
        const st = camState[host]; if (!st) return;
        const filename = `${slugify(names[host] || host)}_${tsStamp()}.jpg`;
        // Canvas approach: works because the MJPEG proxy sends ACAO:* and the
        // img has crossorigin="anonymous". Falls back to direct download of
        // the snapshot poller file (cam-<ip>.jpg) on any failure.
        const fallback = () => {
            const a = document.createElement("a");
            // true: someone saving a picture wants the full-size one, whatever
            // the tile happens to be displaying.
            a.href = snapshotUrl(host, true);
            a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        };
        // A WebRTC tile draws in the <video>; the <img> under it is the poster
        // from before promotion, minutes old.
        const rtc = st.mode === "webrtc" && st.videoEl && st.videoEl.videoWidth ? st.videoEl : null;
        if (!rtc && (!st.imgEl.complete || !st.imgEl.naturalWidth)) return fallback();
        try {
            const c = document.createElement("canvas");
            c.width  = rtc ? rtc.videoWidth  : st.imgEl.naturalWidth;
            c.height = rtc ? rtc.videoHeight : st.imgEl.naturalHeight;
            c.getContext("2d").drawImage(rtc || st.imgEl, 0, 0);
            c.toBlob(blob => {
                if (!blob) return fallback();
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url; a.download = filename;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 2000);
            }, "image/jpeg", 0.92);
        } catch (e) {
            // SecurityError: tainted canvas (CORS not applied). Fall back.
            fallback();
        }
    }

    // ── Focus mode ─────────────────────────────────────────────
    // Exactly one tile is focused (the big one at the top of the grid).
    // Tapping any other tile just moves the focused class — live and still
    // tiles keep their assigned mode forever. No swapping, no MJPEG
    // reconnection on click.
    function focusTile(host) {
        if (focusedHost === host) return;
        const previous = focusedHost;
        if (focusedHost && camState[focusedHost]) {
            camState[focusedHost].frameEl.closest(".cam").classList.remove("focused");
        }
        const wrap = camState[host]?.frameEl?.closest(".cam");
        if (wrap) wrap.classList.add("focused");
        document.getElementById("grid").classList.add("has-focus");
        focusedHost = host;
        if (wrap) wrap.scrollIntoView({ behavior: "smooth", block: "start" });

        // Away over the tunnel the WEBRTC slot follows the focus. Stop the
        // old tile FIRST — never two peer connections at once, the same rule
        // as the never-two-MJPEG-sockets one below.
        if (WEBRTC_FOCUS) {
            // The previous focus drops to a still whether it was WebRTC OR the
            // single MJPEG tile a near-tunnel fallback left it on (v2.95.1) —
            // never two streams over the tunnel.
            if (previous && camState[previous]
                    && (camState[previous].mode === "webrtc" || camState[previous].mode === "live")) {
                startStill(previous);            // closes the pc via stopWebrtc
            }
            const stN = camState[host];
            if (stN && stN.mode !== "webrtc" && !stN.paused) {
                stN.webrtcFails = 0;             // a promoted tile gets a clean slate
                stN.webrtcRetryAt = 0;
                startWebrtc(host);
            }
        }

        // Off the LAN there is one live stream and it belongs to whichever
        // tile is at the top. Hand it over: drop the old one to stills first
        // so we are never holding two MJPEG sockets at once, which is what
        // iOS Safari struggles with.
        if (LIVE_FOLLOWS_FOCUS && camState[host] && camState[host].mode !== "live") {
            if (previous && camState[previous] && camState[previous].mode === "live") {
                startStill(previous);
            }
            const st = camState[host];
            // Give the newly-promoted tile a clean slate — if it had been
            // auto-degraded earlier, it deserves a fresh attempt rather than
            // inheriting somebody else's backoff.
            st.autoDegraded = false;
            st.degradeCount = 0;
            st.retryAfterMs = 0;
            startLive(host);
        }

        // Off-LAN there is no live slot to move, but the focused tile polls
        // faster than the rest — so both the tile gaining focus and the one
        // losing it need their timer rebuilt at the new rate. Without this the
        // faster interval would stay on whichever tile happened to be focused
        // when the page loaded.
        if (LINK !== "home") {
            for (const h of [previous, host]) {
                const s = h && camState[h];
                if (s && s.mode === "still" && !s.paused) startStill(h);
            }
        }
    }

    // ── Grid construction ──────────────────────────────────────
    function buildGrid() {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        for (const host of hosts) {
            const name = names[host] || host;
            const wrap = document.createElement("div");
            wrap.className = "cam";
            wrap.dataset.host = host;
            wrap.innerHTML = `
                <div class="cam-frame">
                    <div class="cam-toolbar">
                        <button class="cam-btn" data-action="snap" title="Snapshot">⤓</button>
                    </div>
                    <div class="placeholder">Connecting…</div>
                    <img alt="${escAttr(name)}">
                </div>
                <div class="cam-meta">
                    <span class="name"><span class="dot"></span></span>
                    <span class="age"></span>
                    <span class="bw">— kB/s</span>
                    <span class="host"><span class="mode">live</span> · ${escAttr(host)}</span>
                </div>`;
            grid.appendChild(wrap);

            const img    = wrap.querySelector("img");
            const frame  = wrap.querySelector(".cam-frame");
            const dot    = wrap.querySelector(".dot");
            const modeEl = wrap.querySelector(".mode");
            const bwEl   = wrap.querySelector(".bw");
            const ageEl  = wrap.querySelector(".age");

            camState[host] = { imgEl: img, frameEl: frame, dotEl: dot, modeEl, bwEl, ageEl,
                                mode: "off", paused: false,
                                lastBytes: null,
                                // Wall-clock time of the most recent bytes-arrived
                                // event from the camera→go2rtc telemetry. The
                                // bandwidth-poll tick flips the dot to amber when
                                // this gets > STALE_MS old (frozen-frame detection,
                                // since <img> onerror doesn't fire for MJPEG that
                                // simply stops mid-stream).
                                lastFreshAt: null };

            // ONE source of truth for the frame handlers, stored on the tile
            // state: replaceImg attaches them to each fresh element, startStill
            // re-attaches on resume, and pauseTile detaches them before poking
            // src so a data-URL or transparent-pixel assignment can never fire
            // a synthetic "frame arrived".
            camState[host].onFrameLoad = () => {
                const st = camState[host];
                frame.classList.add("has-image");
                frame.classList.remove("error");
                frame.classList.remove("connecting");   // first frame arrived
                if (st.liveTimeout) { clearTimeout(st.liveTimeout); st.liveTimeout = null; }
                dot.classList.remove("bad");
                dot.classList.remove("stale");
                dot.classList.add("ok");
                st.lastFreshAt = Date.now();        // bootstrap the watchdog
                if (!st.paused) setMode(host, st.mode === "live" ? "live" : "still");
                // Only a LIVE tile stamps Updated from onload — a still's
                // onload fires for the objectURL swap of a frame the blob
                // path already stamped, and double-stamping hid the gap
                // between "we fetched something" and "a new frame arrived".
                if (st.mode === "live") markRefreshed();
            };
            camState[host].onFrameError = () => {
                const st = camState[host];
                if (!st || st.paused) return;
                if (st.mode === "live") {
                    // A live socket dying mid-stream used to land here as a
                    // terminal "Unreachable" — nothing ever retried it. Route
                    // it through the degrade ladder instead: stills keep the
                    // tile alive and the watchdog's backoff owns the retry.
                    degradeToStill(host, "stream error");
                    return;
                }
                frame.classList.remove("has-image");
                frame.classList.add("error");
                dot.classList.remove("ok");
                dot.classList.remove("stale");
                dot.classList.add("bad");
                frame.querySelector(".placeholder").textContent = "Unreachable";
                setMode(host, "off");
            };
            img.onload  = camState[host].onFrameLoad;
            img.onerror = camState[host].onFrameError;

            // Click frame (anywhere except a toolbar button) → focus this tile.
            // Live/still mode of every tile is fixed for the lifetime of the
            // page; clicking only changes which tile is the big one at the top.
            frame.addEventListener("click", (e) => {
                if (e.target.closest(".cam-btn")) return;
                focusTile(host);
            });

            // Toolbar wiring — only Snapshot remains; click on the tile itself
            // handles live/still toggle and focus changes.
            wrap.querySelector('[data-action="snap"]').addEventListener("click", (e) => {
                e.stopPropagation(); takeSnapshot(host);
            });
        }
        document.getElementById("grid-cam-count").textContent = String(hosts.length);
    }

    // ── Re-layout / pause all ──────────────────────────────────
    // Lays every tile out under the CURRENT policy: the default-live set gets
    // MJPEG, everything else snapshot-polls. Used at boot, on resume, and on
    // every policy change.
    function relayoutAll() {
        for (const host of hosts) {
            const st = camState[host];
            if (st) {
                // A policy re-layout is a new world: backoff earned under the
                // old policy is meaningless, and a latched autoDegraded would
                // otherwise pin this tile to 5 s polls forever — the period
                // ladder in startStill reads it. Mirrors what focusTile does
                // for a promoted tile.
                st.autoDegraded = false;
                st.degradeCount = 0;
                st.retryAfterMs = 0;
                st.webrtcFails   = 0;
                st.webrtcRetryAt = 0;
            }
            // mayHoldLive, not DEFAULT_LIVE_SET: with a pool of one the live
            // entitlement FOLLOWS THE FOCUS, and a tab hide/show used to hand
            // the slot back to hosts[0] regardless of which tile the user had
            // focused before backgrounding the page.
            if (WEBRTC_FOCUS && host === (focusedHost || hosts[0])) startWebrtc(host);
            else if (mayHoldLive(host) && LIVE_POOL_SIZE > 0) startLive(host);
            else                                 startStill(host);
        }
    }
    function stopAll() {
        for (const host of hosts) pauseTile(host);
    }

    // ── Bandwidth polling ──────────────────────────────────────
    // Hits the plugin proxy's /streams endpoint, which forwards go2rtc's
    // /api/streams JSON. We use the <slug>_mjpeg producer's bytes_recv counter
    // — that's the bytes go2rtc reads from its ffmpeg pipe per stream, which
    // tracks what we ship to the browser pretty closely.
    let _bwTimer    = null;
    let _bwLastTs   = null;        // last _writeTs we processed
    // Stale-stream watchdog: if a camera's bytes_recv hasn't advanced in this
    // many milliseconds, flip its dot to amber. MJPEG <img> tags don't fire
    // `onerror` when a stream goes silent mid-flow (TCP stays open, frames
    // just stop) so the bandwidth telemetry is the only reliable heartbeat.
    const STALE_MS = 10000;
    // Bytes this page has actually received, ever. Deltas between ticks give
    // the real rate. Stills are exact (we can see each blob); a live MJPEG tile
    // is not measurable from JS, so its share is still taken from go2rtc's
    // producer counter — approximate, but at least those bytes genuinely are
    // being sent to this device.
    let _rxBytes = 0, _rxLast = 0, _rxLastAt = 0;
    let _healthLastFetch = 0;
    function paintCameraHealth(health) {
        const el = document.getElementById("camera-health-bot");
        if (!el || !health || typeof health !== "object") return;
        const rows = Object.values(health);
        if (!rows.length) return;
        const offline = rows.filter(x => x && x.state === "offline").length;
        const retrying = rows.filter(x => x && x.state === "retrying").length;
        el.textContent = offline ? `${offline} camera${offline === 1 ? "" : "s"} offline`
            : retrying ? `${retrying} camera${retrying === 1 ? "" : "s"} retrying`
            : "health OK";
        el.style.color = offline ? "var(--bad)" : retrying ? "var(--warn)" : "var(--on-color)";
    }
    /* One owner for both readouts. The top bar has room for the word, the
       footer has not — and the footer's line must not grow (see .foot-line). */
    function _setBw(rate) {
        const top = document.getElementById("total-bw");
        if (top) top.textContent = rate + " total";
        const bot = document.getElementById("total-bw-bot");
        if (bot) bot.textContent = rate;
    }

    function startBandwidthPoll() {
        if (_bwTimer) clearInterval(_bwTimer);
        const tick = async () => {
            try {
                // WebRTC tiles first: fold their inbound bytes into _rxBytes
                // (they ARE bytes this page pulled down, measured exactly from
                // the peer connection's own counters) and paint the per-tile
                // rate. This tick runs once a second, so the delta is the rate.
                for (const host of hosts) {
                    const st = camState[host];
                    if (!st || st.mode !== "webrtc" || !st.pc) continue;
                    try {
                        const stats = await st.pc.getStats();
                        let inbound = null;
                        stats.forEach((s) => {
                            if (s.type === "inbound-rtp" && s.kind === "video") inbound = s;
                        });
                        if (inbound && inbound.bytesReceived != null) {
                            const d = inbound.bytesReceived - (st.lastRtcBytes || 0);
                            st.lastRtcBytes = inbound.bytesReceived;
                            if (d > 0) _rxBytes += d;
                            if (st.bwEl) {
                                const k = d / 1024;
                                st.bwEl.style.visibility = "visible";
                                st.bwEl.textContent = k > 1024
                                    ? `${(k / 1024).toFixed(1)} MB/s`
                                    : `${k.toFixed(0)} kB/s`;
                            }
                        }
                    } catch (e) { /* stats are best-effort */ }
                }

                // Update the total from our OWN byte counter first, so it is
                // right whether or not we go on to ask the server anything.
                const nowMs0 = Date.now();
                let ownKBs = 0;
                if (_rxLastAt) {
                    const secs = (nowMs0 - _rxLastAt) / 1000;
                    if (secs > 0) ownKBs = (_rxBytes - _rxLast) / 1024 / secs;
                }

                // A still tile's health is whether ITS OWN fetches are coming
                // back — not whether go2rtc is receiving from that camera,
                // which it does regardless of whether this page can reach it.
                // Judging stills by the server's counter meant a tile could sit
                // frozen showing a confident green dot.
                for (const host of hosts) {
                    const st = camState[host];
                    if (!st || st.mode !== "still" || st.paused) continue;
                    if (st.lastFrameAt == null) continue;
                    const stale = (nowMs0 - st.lastFrameAt) > STALE_MS;
                    if (st.dotEl.classList.contains("bad")) continue;
                    st.dotEl.classList.toggle("stale", stale);
                    st.dotEl.classList.toggle("ok", !stale);
                }

                // streams.json exists only to read go2rtc's per-producer byte
                // counters, which are meaningful for LIVE tiles alone. Off the
                // LAN there are none, so this was a request a second, from every
                // phone, for a number nothing used.
                const anyLive = hosts.some(h => camState[h] && camState[h].mode === "live");
                const needsHealth = (Date.now() - _healthLastFetch) > 30000;
                if (!anyLive && !needsHealth) {
                    _rxLast = _rxBytes; _rxLastAt = nowMs0;
                    const str = ownKBs > 1024 ? `${(ownKBs/1024).toFixed(1)} MB/s`
                                              : `${ownKBs.toFixed(0)} kB/s`;
                    _setBw(str);
                    return;
                }

                const r = await fetch(streamsApi(), { cache: "no-store" });
                if (!r.ok) return;
                const data = await r.json();
                _healthLastFetch = Date.now();
                paintCameraHealth(data._cameraHealth);
                // Health is the only reason an all-stills page reaches this
                // far. Preserve its locally measured bandwidth rather than
                // briefly replacing it with an irrelevant go2rtc total.
                if (!anyLive) {
                    _rxLast = _rxBytes; _rxLastAt = nowMs0;
                    const str = ownKBs > 1024 ? `${(ownKBs/1024).toFixed(1)} MB/s`
                                              : `${ownKBs.toFixed(0)} kB/s`;
                    _setBw(str);
                    return;
                }
                const ts   = data._writeTs;
                // Skip if the file hasn't been refreshed since our last read —
                // otherwise the delta is 0 and the display flicks to 0 kB/s.
                if (ts == null || ts === _bwLastTs) return;
                let total = 0;
                const now = Date.now();
                for (const host of hosts) {
                    const slug = slugs[host];
                    if (!slug) continue;
                    const s = data[`${slug}_mjpeg`];
                    const bytes = (s && s.producers && s.producers[0] &&
                                   s.producers[0].bytes_recv) || 0;
                    const st = camState[host];
                    if (!st) continue;
                    if (st.lastBytes != null && st.lastTs != null) {
                        const dB = bytes - st.lastBytes;
                        const dT = ts - st.lastTs;       // seconds (server clock)
                        if (dB >= 0 && dT > 0) {
                            const kBs = dB / 1024 / dT;
                            st.bwEl.textContent = kBs > 1024
                                ? `${(kBs/1024).toFixed(1)} MB/s`
                                : `${kBs.toFixed(0)} kB/s`;
                            // ONLY for a tile actually holding a live stream.
                            // A still tile downloads a small JPEG once a second
                            // while go2rtc goes on pulling RTSP from that camera
                            // regardless — counting that here is what produced
                            // the wildly overstated total.
                            if (!st.paused && st.mode === "live") total += kBs;
                        }
                        // Stale-stream watchdog: if bytes have increased,
                        // mark fresh and clear any amber state.
                        if (dB > 0) {
                            st.lastFreshAt = now;
                            if (st.dotEl.classList.contains("stale")) {
                                st.dotEl.classList.remove("stale");
                                st.dotEl.classList.add("ok");
                            }
                        }
                    }
                    // Flip to amber if frames have stopped arriving for
                    // STALE_MS+. Don't override "bad" (image-load error) —
                    // that's a stronger signal. Also skip cams in "off" mode
                    // because the tile isn't pulling frames anyway.
                    if (st.lastFreshAt != null
                            && (now - st.lastFreshAt) > STALE_MS
                            && !st.dotEl.classList.contains("bad")
                            && st.mode !== "off") {
                        if (!st.dotEl.classList.contains("stale")) {
                            st.dotEl.classList.remove("ok");
                            st.dotEl.classList.add("stale");
                        }
                    }
                    st.lastBytes = bytes;
                    st.lastTs    = ts;
                }
                _bwLastTs = ts;
                // Our own bytes were worked out at the top of the tick; add them
                // to the live tiles' share. Computed once, used once — an
                // earlier version of this did it in both places and doubled it.
                total += ownKBs;
                _rxLast = _rxBytes; _rxLastAt = nowMs0;
                _setBw(total > 1024 ? `${(total/1024).toFixed(1)} MB/s`
                                    : `${total.toFixed(0)} kB/s`);
            } catch (e) { /* ignore */ }
        };
        tick();
        // One tick in flight (v2.95.3): over the reflector a round trip took
        // 0.9-1.8 s, so 1 s ticks overlapped and the rate bookkeeping raced.
        let inflight = false;
        _bwTimer = setInterval(() => {
            if (inflight) return;
            inflight = true;
            Promise.resolve().then(tick).catch(() => {}).finally(() => { inflight = false; });
        }, LINK === "reflector" ? 10000 : 1000);  // poll faster than file writes; a tenth of that through the reflector (v2.96.1)
    }

    // ── Client-side stall watchdog ─────────────────────────────
    // Runs independently of the bandwidth poll (and of any server telemetry) so
    // it still works when the page is reached over a link that can't sustain
    // MJPEG — which is exactly when it's needed. Purely local: samples the
    // rendered image and compares it with the previous sample.
    let _stallTimer = null;
    function startStallWatchdog() {
        if (_stallTimer) clearInterval(_stallTimer);
        const tick = () => {
            const now = Date.now();
            for (const host of hosts) {
                const st = camState[host];
                if (!st || st.paused) continue;

                if (st.mode === "live") {
                    const sig = frameSignature(st.imgEl);
                    if (sig === null) continue;          // can't sample — stay out of the way
                    if (st.lastSig === null || st.lastSig === undefined) {
                        st.lastSig      = sig;
                        st.lastChangeAt = now;
                        continue;
                    }
                    if (sig !== st.lastSig) {
                        st.lastSig      = sig;
                        st.lastChangeAt = now;
                        // Frames are flowing. If this tile had been degraded,
                        // it has recovered — clear the marker and, after a good
                        // run, forgive the backoff so a one-off blip doesn't
                        // leave it permanently cautious.
                        if (st.autoDegraded) {
                            st.autoDegraded = false;
                            st.recoveredAt  = now;
                            st.degradesSinceRecovery = 0;
                            setMode(host, "live");
                            console.info(`[cameras] ${host} live stream recovered`);
                        }
                        if (st.recoveredAt && (now - st.recoveredAt) > LIVE_RETRY_MAX_MS) {
                            st.degradeCount = 0;
                            st.recoveredAt  = null;
                        }
                        continue;
                    }
                    // Unchanged. Degrade once we're past the stall threshold.
                    if (st.lastChangeAt && (now - st.lastChangeAt) > LIVE_STALL_MS) {
                        degradeToStill(host, `no new frame in ${Math.round((now - st.lastChangeAt)/1000)}s`);
                    }
                } else if (st.mode === "webrtc") {
                    // Stall = the video clock stopped advancing. currentTime
                    // is cheaper and more direct than canvas hashing, and a
                    // WebRTC srcObject cannot taint a canvas anyway if this
                    // ever wants the frameSignature treatment.
                    const v = st.videoEl;
                    if (!v || !st.webrtcGotFrame) continue;  // connecting — the timers own it
                    if (v.currentTime > (st.lastVideoTime || 0)) {
                        st.lastVideoTime    = v.currentTime;
                        st.lastChangeAt     = now;
                        st.webrtcStallTicks = 0;
                    } else if ((st.webrtcStallTicks = (st.webrtcStallTicks || 0) + 1) >= 2) {
                        st.webrtcStallTicks = 0;
                        webrtcFallback(host, "video stalled");
                    }
                } else if (st.mode === "still" && st.autoDegraded) {
                    // Six degrades without ONE recovery = the stream is not
                    // coming back (or the picture is genuinely static, which
                    // the hash cannot tell from a stall) — park on stills
                    // until a user tap or a tab-resume re-layout, instead of
                    // thrashing live/still on the retry ladder for ever.
                    // Park after six degrades with no recovery between them, OR six
                    // since the last recovery: a tile that recovered once at count 3
                    // kept a truthy recoveredAt for ever and was never parked.
                    if ((st.degradesSinceRecovery || 0) >= 6 || ((st.degradeCount || 0) >= 6 && !st.recoveredAt)) {
                        // parked — no retry
                    } else
                    // Degraded tile — is it time to try live again?
                    if (st.degradedAt && (now - st.degradedAt) >= (st.retryAfterMs || LIVE_RETRY_BASE_MS)) {
                        console.info(`[cameras] ${host} retrying live after slow-link fallback`);
                        tryRestoreLive(host);
                    }
                }
                // A fallen webrtc tile retries on its own backoff, whatever
                // mode the fallback left it in — but only while it is still
                // the tile entitled to the slot.
                if (WEBRTC_FOCUS && !st.paused && st.mode !== "webrtc"
                        && host === (focusedHost || hosts[0])
                        && st.webrtcRetryAt && now >= st.webrtcRetryAt) {
                    st.webrtcRetryAt = 0;
                    console.info(`[cameras] ${host} retrying webrtc after fallback`);
                    startWebrtc(host);
                }
            }
        };
        _stallTimer = setInterval(tick, LIVE_PROBE_MS);
    }

    // ── Global controls ────────────────────────────────────────
    // Measure the link and correct the policy if the guess was wrong. The
    // address said "home", but a LAN address arriving over a Tailscale subnet
    // route says exactly the same thing, and acting on it opened six MJPEG
    // streams on a mobile connection. Only ever downgrades — a fast probe
    // cannot make a reflector address local — so the worst case is a second of
    // stills at home, against 44 Mbit/s of mobile data the other way round.
    // ── Is this device on the house wi-fi? ────────────────────
    // The best answer does not come from timing anything. The UniFi controller
    // already knows which phones are associated with which access point, and
    // the UniFiHealth plugin surfaces that as a device carrying `presence` and
    // `essid`. So instead of inferring "probably home" from a round trip, ASK.
    //
    // Why this is worth the trouble: CliveS runs Tailscale permanently, home
    // included, and rightly refuses to turn it off indoors — dropping it on
    // wi-fi to earn live video would also drop it on café and hotel wi-fi.
    // With the tunnel up, timing cannot separate home (116 ms measured) from
    // 5G (245 ms measured). Wi-fi association can, exactly and instantly.
    //
    // Which phone this browser IS has to be stored per-device, so it lives in
    // this browser's localStorage rather than the shared plugin config.
    // Unpaired, everything falls back to the timing bands and behaves as before.
    const PRESENCE_KEY = "dash_presence_device";
    const PRESENCE_MAX_MIN = 3;    // a stale "home" is the dangerous direction
    // NB _lastPresence is declared up beside camState — renderPolicy reads it
    // at boot, long before this section runs.

    function pairedPresenceId() {
        try {
            const v = JSON.parse(localStorage.getItem(PRESENCE_KEY) || "null");
            return v && v.id ? v : null;
        } catch (e) { return null; }
    }

    function homeByPresence() {
        const paired = pairedPresenceId();
        const key = (window.INDIGO_CONFIG || {}).apiKey;
        if (!paired || !key) return Promise.resolve(null);   // null = no opinion
        return fetch(`/v2/api/indigo.devices/${encodeURIComponent(paired.id)}`, {
            cache: "no-store",
            headers: { Authorization: "Bearer " + key, Accept: "application/json" },
        })
            .then(r => (r.ok ? r.json() : null))
            .then(dev => {
                const st = (dev && dev.states) || {};
                if (st.presence == null) return null;
                // Require it to be RECENTLY seen. UniFi debounces a client
                // dropping off, so "home" can outlive the fact by a few minutes
                // — and being wrongly at home is the expensive direction, six
                // live streams on mobile data.
                const mins = Number(st.minutesSinceSeen);
                const fresh = !isNaN(mins) && mins <= PRESENCE_MAX_MIN;
                return { home: String(st.presence) === "home" && fresh,
                         essid: st.essid || "", mins: mins };
            })
            .catch(() => null);
    }

    // A still tile that fails three fetches in a row and has never shown a
    // frame is NOT "Connecting…" — it is a dead camera or a bad config entry,
    // and the tile says so (v2.95.3). Cleared by the next good frame.
    function _stillFailed(st, why) {
        st.stillFails = (st.stillFails || 0) + 1;
        if (st.stillFails >= 3 && !st.hadFrame && st.frameEl) {
            st.frameEl.classList.remove("connecting");
            st.frameEl.classList.add("error");
            st.frameEl.dataset.err = "No snapshot (" + why + ")";
        }
    }
    function _stillOk(st) {
        st.stillFails = 0;
        st.hadFrame = true;
        if (st.frameEl && st.frameEl.classList.contains("error")) {
            st.frameEl.classList.remove("error");
            delete st.frameEl.dataset.err;
        }
    }

    let _measureInflight = null;
    function measureAndApply() {
        if (!(window.DashUI && DashUI.measuredClass)) return Promise.resolve();
        // SINGLE-FLIGHT. Boot and a fast visibilitychange can both call this,
        // and two overlapping runs would each re-lay-out every tile — the
        // second tearing down streams the first had only just started.
        if (_measureInflight) return _measureInflight;
        _measureInflight = Promise.all([
            DashUI.measuredClass(),
            DashUI.probeRtt ? DashUI.probeRtt() : Promise.resolve(null),
            homeByPresence(),
        ]).then(([cls, ms, presence]) => {
            // Wi-fi association BEATS timing when we have it. A phone the
            // controller can see on the house wi-fi is on the house wi-fi,
            // whatever a tunnel does to the round trip — the traffic never
            // leaves the building, so the full live pool is affordable.
            //
            // Both must agree, though. Presence is required to be recent AND
            // the round trip must still be inside the tunnel band, so a stale
            // "home" from the controller cannot on its own open six streams on
            // mobile data. Belt and braces, because that is the failure that
            // stalled his phone in the first place.
            let effective = cls, why = "";
            if (presence && presence.home && cls !== "reflector"
                    && ms != null && ms <= RTT_TUNNEL_MS) {
                effective = "home";
                why = ` (on ${presence.essid || "the house wi-fi"})`;
            }
            _lastPresence = presence;
            // Remember the verdict — changed or not — so the next boot (or a
            // resume within 60 s) starts from a MEASURED answer instead of the
            // address guess. See bootPolicy.
            cachePolicy(effective, ms);
            // setPolicy is the ONE owner of the derivation (v2.95.1). This used
            // to recompute a live COUNT here and relayout only when that count
            // or the class changed — but the WebRTC band has a live count of
            // ZERO by design (the focused tile streams WebRTC, the rest are
            // stills), the same zero as the conservative boot policy. So a
            // phone resumed on 5G after the 60 s cache lapsed booted "vpn, 0
            // live", measured "vpn, 0 live", saw no change and never engaged
            // WebRTC: nine stills, silently, on the exact link the feature was
            // built for. Now: apply the policy, then relayout if ANY of the
            // three things it decides moved.
            const before = [LINK, LIVE_POOL_SIZE, WEBRTC_FOCUS];
            setPolicy(effective, ms);
            const after = [LINK, LIVE_POOL_SIZE, WEBRTC_FOCUS];
            if (before.some((v, i) => v !== after[i])) {
                console.info(`[cameras] link measured at ${Math.round(ms)}ms${why} — `
                           + `${before[0]} -> ${after[0]}, ${after[1]} live`
                           + `${after[2] ? ", webrtc focus" : ""}`);
                relayoutAll();
            }
            renderPolicy(ms);
        }).catch(() => { /* keep the current policy */ })
          .finally(() => { _measureInflight = null; });
        return _measureInflight;
    }

    // ── Pairing this browser with a presence device ───────────
    // Deliberately per-BROWSER (localStorage), not in the shared plugin config:
    // "which phone is this" is a different answer on every device, and the
    // settings page saves to config that all of them share.
    function renderPairButton() {
        const btn = document.getElementById("pair-device");
        if (!btn) return;
        const p = pairedPresenceId();
        btn.textContent = "this device is: " + (p ? p.name : "not set");
    }
    async function choosePresenceDevice() {
        const key = (window.INDIGO_CONFIG || {}).apiKey;
        if (!key) { alert("Connect this browser to Indigo first — the Connect form on the hub."); return; }
        let devices = [];
        try {
            const r = await fetch("/v2/api/indigo.devices", {
                headers: { Authorization: "Bearer " + key, Accept: "application/json" } });
            if (!r.ok) throw new Error("HTTP " + r.status);
            const all = await r.json();
            // Anything exposing a `presence` state qualifies, so this is not
            // tied to one plugin — another presence source would appear here too.
            devices = (Array.isArray(all) ? all : []).filter(d =>
                d && d.states && d.states.presence != null);
        } catch (e) {
            alert("Could not read the device list from Indigo: " + e.message);
            return;
        }
        if (!devices.length) {
            alert("No devices with a presence state were found. UniFiHealth creates "
                + "one per tracked phone.");
            return;
        }
        const lines = devices.map((d, i) => (i + 1) + ". " + d.name).join("\n");
        const pick = prompt("Which of these is THIS device?\n\n" + lines
            + "\n\nEnter a number, or 0 to forget the setting.", "1");
        if (pick == null) return;
        const n = parseInt(pick, 10);
        if (n === 0) {
            try { localStorage.removeItem(PRESENCE_KEY); } catch (e) {}
        } else if (n >= 1 && n <= devices.length) {
            const d = devices[n - 1];
            try {
                localStorage.setItem(PRESENCE_KEY, JSON.stringify({ id: d.id, name: d.name }));
            } catch (e) {}
        } else { return; }
        renderPairButton();
        if (window.DashUI && DashUI.forgetRtt) DashUI.forgetRtt();
        measureAndApply();
    }

    // Pause streaming when the tab is hidden so we're not pulling video
    // bandwidth from the cameras for nothing. Resume on visibility.
    //
    // Coming BACK is also the moment to re-check the link. A phone that was
    // put down at home and picked up on mobile data is the ordinary case, and
    // the old code could not notice: the verdict was cached for the whole
    // browser session, so the page went on behaving as though it were at home
    // until the tab was closed. Reported exactly that way — wi-fi off, no
    // change. iOS has no network-change event worth relying on, but coming
    // back to the page is a good enough proxy and costs three small fetches.
    // A page being torn down must not leave a peer connection behind —
    // iOS Safari kills the JS context on navigation but the ICE consumer on
    // the server side otherwise lingers until its own timeout.
    window.addEventListener("pagehide", () => {
        for (const host of hosts) {
            const st = camState[host];
            if (st && st.pc) stopWebrtc(st);
        }
    });

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) { stopAll(); return; }
        // Re-decide from the cached measured verdict (bounded 60 s) before
        // resuming a single tile. The old path resumed straight into the LAST
        // policy, which for a phone put down at home and picked up on 5G was
        // six live MJPEG streams into a mobile link.
        bootPolicy();
        relayoutAll();
        if (window.DashUI && DashUI.forgetRtt) DashUI.forgetRtt();
        measureAndApply();
    });

    // ── Boot ──────────────────────────────────────────────────
    if (!hosts.length) {
        document.getElementById("warn").innerHTML =
            `<div class="config-warn">No cameras configured yet — add them on the
             <a href="settings.html">Settings page</a> (camera credentials come from the
             plugin's Configure dialog), then restart the plugin.</div>`;
    } else {
        buildGrid();
        // Initial layout under the BOOT policy — the cached measured verdict,
        // or conservative all-stills when there isn't a fresh one (see
        // bootPolicy). measureAndApply below corrects it within a second or
        // two; what it can no longer do is open six MJPEG streams on an
        // unverified "home" guess.
        relayoutAll();
        // Pin focus to Garage (already live; this just adds the .focused class
        // and the has-focus grid layout — no live-set change since Garage is
        // already in the default pool).
        const grid = document.getElementById("grid");
        grid.classList.add("has-focus");
        const wrap = camState[hosts[0]]?.frameEl?.closest(".cam");
        if (wrap) wrap.classList.add("focused");
        focusedHost = hosts[0];
        startBandwidthPoll();
        startStallWatchdog();
        // Tap the footer policy line to toggle the debug view: every tile
        // shows its age (plus the clock-skew tell), not just the focused one.
        const policyLine = document.getElementById("link-policy");
        if (policyLine) policyLine.addEventListener("click", () => {
            try { localStorage.setItem("dash_cam_debug", debugAges() ? "0" : "1"); } catch (e) {}
            tickAges();
        });
        renderPairButton();
        const pairBtn = document.getElementById("pair-device");
        if (pairBtn) pairBtn.addEventListener("click", choosePresenceDevice);

        // Now MEASURE the link and correct the boot policy. Booting
        // conservative means this is usually an UPGRADE (stills → the live
        // pool at home); the reflector stays pinned by its address, which a
        // fast probe can never make local. Worst case is a second of stills
        // at home, against 44 Mbit/s of mobile data the other way round.
        if (window.DashUI && DashUI.measuredClass) measureAndApply();
    }
    </script>
<script src="a11y.js"></script>
<script src="standalone-nav.js"></script>
</body>
</html>
